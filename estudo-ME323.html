<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME323 Arena</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
.katex{font-size:1.07em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0;margin:.4em 0}
.card li .katex, .cola li .katex{line-height:2.1}
.opt .katex{font-size:1.04em}
.fcq .katex,.fca .katex{font-size:1.12em}
#nomath{display:none;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
:root{
  --bg:#f5f3ef; --card:#ffffff; --ink:#1d1b19; --muted:#6c665f; --line:#e2ddd6;
  --accent:#8a2424; --accent-soft:#f6e5e2; --ok:#1d7a45; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --gold:#b7791f; --gold-soft:#fbf0dc; --chip:#eeeae4; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --card:#1f1d1b; --ink:#ede9e4; --muted:#a49d95; --line:#35312d;
  --accent:#e58b80; --accent-soft:#3a2422; --ok:#5fc98d; --ok-soft:#1b3326; --bad:#f08b81; --bad-soft:#3d211f;
  --gold:#e8b45a; --gold-soft:#3a2f1c; --chip:#2b2825; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#141312; --card:#1f1d1b; --ink:#ede9e4; --muted:#a49d95; --line:#35312d;
  --accent:#e58b80; --accent-soft:#3a2422; --ok:#5fc98d; --ok-soft:#1b3326; --bad:#f08b81; --bad-soft:#3d211f;
  --gold:#e8b45a; --gold-soft:#3a2f1c; --chip:#2b2825; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
#examIn{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;width:84px;color-scheme:inherit}
#hud-exam span{cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:10px 0 6px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.hud{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:600;white-space:nowrap}
.lvl{min-width:170px}
.lvl .bar{flex:1;height:6px;background:var(--chip);border-radius:9px;overflow:hidden;min-width:60px}
.lvl .bar>div{height:100%;background:var(--gold);transition:width .5s}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 9px;font:inherit;font-size:13.5px;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:650;font-size:15px;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 2px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
main{padding:8px 0 70px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:18px}
.card h4{margin:14px 0 4px;font-size:15px;color:var(--accent)}
.card ul,.card ol{margin:4px 0;padding-left:22px}
.card li{margin:2px 0}
.ideia{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:8px 0}
.cola{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin:10px 0}
.cola b.t{color:var(--gold)}
.tag{display:inline-block;font-size:12px;font-weight:750;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-right:6px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
table{border-collapse:collapse;margin:8px 0;font-size:14.5px}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--chip)}
table.mini td,table.mini th{text-align:center;padding:3px 10px}
.tablewrap{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:650;font-size:14.5px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.big{padding:14px 18px;font-size:16px;border-radius:12px}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.center{justify-content:center;text-align:center}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0}
.progress>div{height:100%;background:var(--accent);transition:width .4s}
/* painel */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.ring{--p:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--chip) 0);display:grid;place-items:center;flex:0 0 auto}
.ring>div{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:24px;line-height:1.1}
.ring small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--chip);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.les{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.les .h{display:flex;align-items:center;gap:8px}
.les .h b{font-size:14.5px}
.les .badge{margin-left:auto;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.lv0{background:var(--chip);color:var(--muted)} .lv1{background:var(--bad-soft);color:var(--bad)} .lv2{background:var(--gold-soft);color:var(--gold)} .lv3{background:var(--accent-soft);color:var(--accent)} .lv4{background:var(--ok-soft);color:var(--ok)}
.les .bar{height:9px;background:var(--chip);border-radius:9px;overflow:hidden;margin:8px 0}
.les .bar>div{height:100%;transition:width .5s}
.les .acts{display:flex;gap:6px}
.les .acts button{flex:1;padding:6px 8px;font-size:13px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.a{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.a.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.a .e{font-size:20px;display:block;filter:grayscale(1);opacity:.5}
.a.got .e{filter:none;opacity:1}
/* treino */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode .e{font-size:24px}
.mode b{display:block;margin:4px 0 2px}
.mode span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--card)}
.shead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.combo{font-weight:800;color:var(--gold)}
.timer{height:5px;background:var(--chip);border-radius:9px;overflow:hidden;margin:8px 0 0}
.timer>div{height:100%;background:var(--gold);width:100%}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:10px}
.fcq{font-size:19px;text-align:center;padding:22px 8px}
.fca{font-size:17px;text-align:center;padding:14px;border-radius:10px;background:var(--ok-soft);border:1px solid var(--ok)}
.score{font-size:46px;font-weight:850;color:var(--accent);margin:2px 0}
.gain{display:inline-block;font-weight:800;color:var(--gold);animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kbd{font-size:12px;color:var(--muted)}
/* slides */
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-head h3{font-size:16.5px;margin:0}
.q-head label{margin-left:auto;font-size:13.5px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
.sol{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);border:1px solid var(--ok)}
.done-card{opacity:.7}
details.les2>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.les2>summary::-webkit-details-marker{display:none}
details.les2>summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.les2[open]>summary::after{content:"－"}
details.les2>summary h3{margin:0}
/* toasts */
#toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--card);border:1px solid var(--gold);border-left:6px solid var(--gold);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .4s;font-size:14.5px}
.toast b{display:block}
.burst{position:fixed;pointer-events:none;z-index:60;font-size:22px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (max-width:560px){.card{padding:14px}.lvl{min-width:0}.brand{font-size:17px}}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="top">
   <div class="brand">ME323 <span>Arena</span></div>
   <div class="hud">
    <label class="pill" id="hud-exam" title="Hora da prova">⏳ <span>prova às</span><input type="time" id="examIn" aria-label="Hora da prova"></label>
    <div class="pill lvl" title="Nível e XP"><span id="hud-lvl">Nv 1</span><div class="bar"><div id="hud-bar"></div></div><span id="hud-xp" class="small">0 XP</span></div>
    <div class="pill" title="Domínio geral">🎯 <span id="hud-dom">0%</span></div>
    <button class="iconbtn" id="snd" title="Som">🔊</button>
    <button class="iconbtn" id="theme" title="Tema">◐</button>
   </div>
  </div>
  <nav class="tabs" id="tabs">
   <button data-v="painel" class="on">🏠 Painel</button>
   <button data-v="treino">⚡ Treinar</button>
   <button data-v="resumo">📘 Resumo</button>
   <button data-v="slides">📝 Questões dos slides</button>
  </nav>
 </div>
</header>
<div class="wrap">
 <div id="nomath">Sem internet: as fórmulas aparecem em código LaTeX. Conecte-se e recarregue a página para vê-las formatadas.</div>
 <div class="filters" id="filters"></div>
 <main>
  <section class="view on" id="v-painel"></section>

 </main>
</div>

<script>
const LESSONS={"13": "Modelos contínuos de tempo de vida", "14": "Normal e Lognormal", "15": "Vetores aleatórios", "16": "Independência e condicionais", "17": "Esperança condicional, covariância e correlação", "18": "Lei dos Grandes Números e TCL", "19": "Amostragem e estimadores", "20": "Intervalos de confiança", "21": "Testes de hipóteses", "22": "Duas amostras", "23": "Processos estocásticos"};
const RESUMO={"13": "<p class=\"ideia\"><b>A ideia:<\/b> cada modelo contínuo conta uma história: \"qualquer ponto é igualmente provável\" (Uniforme), \"espera sem envelhecer\" (Exponencial), \"espera por várias ocorrências\" (Gama) ou \"espera com envelhecimento controlado\" (Weibull).<\/p>\n<h4>Uniforme$(a,b)$<\/h4>\n<ul><li>$f(x)=\\dfrac{1}{b-a}$ em $[a,b]$; $\\;F(x)=\\dfrac{x-a}{b-a}$.<\/li>\n<li>Probabilidade = fração de comprimento.<\/li>\n<li>$E(X)=\\dfrac{a+b}{2}$, $\\;\\operatorname{Var}(X)=\\dfrac{(b-a)^2}{12}$.<\/li><\/ul>\n<h4>Exponencial$(\\lambda)$ — $\\lambda$ é a taxa<\/h4>\n<ul><li>$f(x)=\\lambda e^{-\\lambda x}$, $x>0$; $\\;$<b>$P(X>t)=e^{-\\lambda t}$<\/b>; $\\;F(t)=1-e^{-\\lambda t}$.<\/li>\n<li>$E(X)=\\dfrac1\\lambda$, $\\;\\operatorname{Var}(X)=\\dfrac{1}{\\lambda^2}$, $\\;$mediana $=\\dfrac{\\ln 2}{\\lambda}$.<\/li>\n<li><b>Falta de memória:<\/b> $P(X>s+t\\mid X>s)=P(X>t)$. A peça usada vale o mesmo que uma nova.<\/li>\n<li>Taxa de falha constante: $h(t)=\\lambda$.<\/li><\/ul>\n<h4>Gama$(\\alpha,\\lambda)$<\/h4>\n<ul><li>Soma de $\\alpha$ exponenciais independentes de taxa $\\lambda$ = espera pela $\\alpha$-ésima ocorrência de um Poisson.<\/li>\n<li>$E(X)=\\dfrac{\\alpha}{\\lambda}$, $\\;\\operatorname{Var}(X)=\\dfrac{\\alpha}{\\lambda^2}$.<\/li>\n<li>Forma inteira: $P(X>t)=e^{-\\lambda t}\\displaystyle\\sum_{k=0}^{\\alpha-1}\\frac{(\\lambda t)^k}{k!}$ (= \"menos de $\\alpha$ ocorrências até $t$\").<\/li>\n<li>Gama$(1,\\lambda)$ = Exponencial$(\\lambda)$.<\/li><\/ul>\n<h4>Weibull$(\\eta,\\beta)$ e taxa de falha<\/h4>\n<ul><li>$F(x)=1-e^{-(x/\\eta)^\\beta}$, $\\;S(x)=e^{-(x/\\eta)^\\beta}$.<\/li>\n<li>Taxa de falha: $h(x)=\\dfrac{f(x)}{S(x)}=\\dfrac{\\beta}{\\eta}\\left(\\dfrac{x}{\\eta}\\right)^{\\beta-1}$ — \"chance de falhar agora, dado que sobreviveu até aqui\".<\/li>\n<li><b>$\\beta<1$<\/b>: taxa cai (mortalidade infantil) · <b>$\\beta=1$<\/b>: constante (= Exponencial) · <b>$\\beta>1$<\/b>: cresce (desgaste). É a curva da banheira.<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Usar $\\lambda$ como média: a média é $1/\\lambda$.<\/li>\n<li>Variância da Exponencial é $1/\\lambda^2$, não $1/\\lambda$.<\/li>\n<li>Achar que a exponencial \"gasta\": $P(\\text{durar mais } t\\mid\\text{já durou } s)=P(X>t)$.<\/li><\/ul>", "14": "<p class=\"ideia\"><b>A ideia:<\/b> quando muitas contribuições pequenas e independentes se somam, o resultado é Normal. Toda Normal é a mesma curva, deslocada ($\\mu$) e esticada ($\\sigma$); por isso uma única tabela ($\\Phi$) serve para todas.<\/p>\n<h4>Normal$(\\mu,\\sigma^2)$<\/h4>\n<ul><li>O segundo parâmetro é a <b>variância<\/b>; o DP é $\\sigma$.<\/li>\n<li>Padronizar: $Z=\\dfrac{X-\\mu}{\\sigma}\\sim N(0;\\,1)$; $\\;P(X\\le x)=\\Phi\\!\\left(\\dfrac{x-\\mu}{\\sigma}\\right)$.<\/li>\n<li>Simetria: $\\Phi(-z)=1-\\Phi(z)$.<\/li>\n<li>Quantil: $x_p=\\mu+z_p\\,\\sigma$ ($z_{0{,}95}=1{,}645$; $z_{0{,}975}=1{,}960$; $z_{0{,}995}=2{,}576$).<\/li><\/ul>\n<h4>Combinações lineares<\/h4>\n<ul><li>$aX+b\\sim N(a\\mu+b,\\;a^2\\sigma^2)$.<\/li>\n<li>Soma/diferença de normais <b>independentes<\/b> é normal: médias somam/subtraem, <b>variâncias sempre somam<\/b>.<\/li>\n<li>Média de $n$ normais iid: $\\bar X\\sim N\\!\\left(\\mu,\\dfrac{\\sigma^2}{n}\\right)$.<\/li><\/ul>\n<h4>Lognormal$(\\mu,\\sigma)$<\/h4>\n<ul><li>$X$ é lognormal se $\\ln X\\sim N(\\mu,\\sigma^2)$: valores positivos e assimétricos.<\/li>\n<li>Mediana $=e^{\\mu}$; $\\;$média $=e^{\\mu+\\sigma^2/2}$ (sempre acima da mediana).<\/li>\n<li>$P(X>x)=1-\\Phi\\!\\left(\\dfrac{\\ln x-\\mu}{\\sigma}\\right)$.<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Ler $N(10;\\,4)$ como DP 4: o DP é 2.<\/li>\n<li>Subtrair variâncias em $X-Y$ ou somar desvios padrão.<\/li>\n<li>Confundir faixa central de 95% ($\\pm1{,}96$) com \"95% menores\" ($+1{,}645$).<\/li>\n<li>Tratar a média da lognormal como $e^{\\mu}$.<\/li><\/ul>", "15": "<p class=\"ideia\"><b>A ideia:<\/b> com duas variáveis, a conjunta descreve o par inteiro. As marginais descrevem cada uma sozinha e jogam fora a informação sobre como elas andam juntas. \"50% são mulheres e 50% usam óculos\" não diz quantas mulheres usam óculos.<\/p>\n<h4>Discreto<\/h4>\n<ul><li>Conjunta: $p(x,y)=P(X=x,Y=y)$, soma 1.<\/li>\n<li>Marginal de $X$ = soma da <b>linha<\/b>: $p_X(x)=\\sum_y p(x,y)$. Marginal de $Y$ = soma da <b>coluna<\/b>.<\/li>\n<li>Probabilidade de um evento = soma das células (ex.: $P(X=Y)$ = diagonal).<\/li>\n<li>Acumulada conjunta: $F(x,y)=P(X\\le x,\\,Y\\le y)$.<\/li><\/ul>\n<h4>Contínuo<\/h4>\n<ul><li>$f(x,y)\\ge0$, $\\;\\iint f=1$. Probabilidade de uma região = integral dupla sobre ela.<\/li>\n<li>Marginal: $f_X(x)=\\displaystyle\\int f(x,y)\\,dy$ (integra a outra variável).<\/li>\n<li><b>Os limites vêm da região<\/b>: no triângulo $0<y<x<1$, para $x$ fixo, $y$ vai de $0$ a $x$.<\/li>\n<li>Constante: $k=\\dfrac{1}{\\text{integral da forma}}$.<\/li>\n<li>Densidade constante: probabilidade = área $\\times$ altura.<\/li><\/ul>\n<h4>Multinomial<\/h4>\n<ul><li>$n$ ensaios, $k$ categorias com probabilidades $p_1,\\dots,p_k$.<\/li>\n<li>$P(n_1,\\dots,n_k)=\\dfrac{n!}{n_1!\\cdots n_k!}\\,p_1^{n_1}\\cdots p_k^{n_k}$.<\/li>\n<li>Cada componente sozinha é $\\text{Bin}(n,p_i)$, mas as componentes não são independentes (somam $n$).<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Integrar de 0 a 1 nas duas variáveis quando a região é um triângulo.<\/li>\n<li>Achar que as marginais determinam a conjunta.<\/li><\/ul>", "16": "<p class=\"ideia\"><b>A ideia:<\/b> condicionar é mudar o universo: \"dado $X=2$\" significa olhar só a linha $X=2$ e redividir para somar 1. Independência é quando essa informação não muda nada.<\/p>\n<h4>Independência<\/h4>\n<ul><li>$X\\perp Y\\iff p(x,y)=p_X(x)\\,p_Y(y)$ em <b>todas<\/b> as células (contínuo: $f=f_X\\,f_Y$).<\/li>\n<li>Para provar: todas as células. Para negar: <b>basta uma<\/b>.<\/li>\n<li>Contínuo: suporte retangular <b>e<\/b> expressão que separa em $g(x)\\,h(y)$ $\\Rightarrow$ independentes.<\/li>\n<li>Suporte não retangular (ex.: triângulo) $\\Rightarrow$ <b>não<\/b> independentes, sem conta.<\/li>\n<li>Suporte retangular sozinho não decide: $x+y$ no quadrado não separa.<\/li><\/ul>\n<h4>Condicional<\/h4>\n<ul><li>$p_{Y\\mid X}(y\\mid x)=\\dfrac{p(x,y)}{p_X(x)}$: célula $\\div$ marginal de <b>quem está depois da barra<\/b>.<\/li>\n<li>Contínuo: $f_{Y\\mid X}(y\\mid x)=\\dfrac{f(x,y)}{f_X(x)}$.<\/li>\n<li>Independência $\\iff$ condicional igual à marginal.<\/li>\n<li>Mínimo de exponenciais independentes: $\\min\\sim\\text{Exp}(\\lambda_1+\\lambda_2)$ (em série, as taxas somam).<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Dividir pela marginal errada ($p_{X\\mid Y}$ divide por $p_Y$).<\/li>\n<li>Responder a conjunta no lugar da condicional.<\/li>\n<li>Concluir independência conferindo uma única célula.<\/li><\/ul>", "17": "<p class=\"ideia\"><b>A ideia:<\/b> a média geral é a média das médias de cada grupo, pesada pelo tamanho do grupo. Covariância mede se as variáveis sobem e descem juntas; a correlação é a mesma coisa, sem unidade, entre $-1$ e $1$.<\/p>\n<h4>Esperança condicional<\/h4>\n<ul><li>$E(Y\\mid X=x)=\\sum_y y\\,p_{Y\\mid X}(y\\mid x)$: um <b>número<\/b>.<\/li>\n<li>$E(Y\\mid X)=\\psi(X)$: uma <b>variável aleatória<\/b>.<\/li>\n<li><b>Esperança iterada:<\/b> $E(Y)=E[E(Y\\mid X)]=\\sum_x E(Y\\mid X=x)\\,p_X(x)$.<\/li>\n<li>Também: $E(XY)=E[X\\,E(Y\\mid X)]$.<\/li><\/ul>\n<h4>Covariância e correlação<\/h4>\n<ul><li><b>$\\operatorname{Cov}(X,Y)=E(XY)-E(X)E(Y)$<\/b>, com $E(XY)=\\sum\\sum xy\\,p(x,y)$ ou $\\iint xy\\,f$.<\/li>\n<li>$\\rho=\\dfrac{\\operatorname{Cov}(X,Y)}{\\sigma_X\\sigma_Y}$, $\\;-1\\le\\rho\\le1$; $\\;\\operatorname{Cov}=\\rho\\,\\sigma_X\\sigma_Y$.<\/li>\n<li>$\\operatorname{Cov}(X,X)=\\operatorname{Var}X$; $\\;\\operatorname{Cov}(aX+b,\\,cY+d)=ac\\operatorname{Cov}(X,Y)$.<\/li>\n<li><b>$\\operatorname{Var}(X\\pm Y)=\\operatorname{Var}X+\\operatorname{Var}Y\\pm2\\operatorname{Cov}(X,Y)$<\/b>.<\/li>\n<li>$\\operatorname{Var}(aX+bY+c)=a^2\\operatorname{Var}X+b^2\\operatorname{Var}Y+2ab\\operatorname{Cov}$.<\/li>\n<li>Independência $\\Rightarrow\\operatorname{Cov}=0$. <b>A volta não vale.<\/b> Correlação não é causalidade.<\/li><\/ul>\n<h4>Propriedades reprodutivas (independentes)<\/h4>\n<ul><li>Normal + Normal = Normal; $\\;\\text{Poisson}(\\lambda_1)+\\text{Poisson}(\\lambda_2)=\\text{Poisson}(\\lambda_1+\\lambda_2)$.<\/li>\n<li>$\\text{Bin}(n_1,p)+\\text{Bin}(n_2,p)=\\text{Bin}(n_1+n_2,p)$ (mesmo $p$).<\/li>\n<li>$\\text{Gama}(\\alpha_1,\\lambda)+\\text{Gama}(\\alpha_2,\\lambda)=\\text{Gama}(\\alpha_1+\\alpha_2,\\lambda)$ (mesma taxa).<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Esquecer o $2\\operatorname{Cov}$ ou o sinal na diferença.<\/li>\n<li>Somar desvios padrão (empilhamento de tolerâncias).<\/li>\n<li>Usar a variância de cada grupo na esperança iterada (só as médias entram).<\/li><\/ul>", "18": "<p class=\"ideia\"><b>A ideia:<\/b> a média de muitas observações se estabiliza (LGN) e sua distribuição fica Normal, qualquer que seja a distribuição original (TCL). Tchebyshev é a garantia que vale sempre, mas é folgada.<\/p>\n<h4>Média amostral<\/h4>\n<ul><li>$E(\\bar X)=\\mu$, $\\;\\operatorname{Var}(\\bar X)=\\dfrac{\\sigma^2}{n}$, $\\;DP(\\bar X)=\\dfrac{\\sigma}{\\sqrt n}$.<\/li>\n<li>Soma: $E(S_n)=n\\mu$, $\\;\\operatorname{Var}(S_n)=n\\sigma^2$.<\/li><\/ul>\n<h4>Tchebyshev e LGN<\/h4>\n<ul><li>$P(|X-\\mu|\\ge k\\sigma)\\le\\dfrac{1}{k^2}$, para qualquer distribuição.<\/li>\n<li>Para a média: $P(|\\bar X-\\mu|\\ge\\varepsilon)\\le\\dfrac{\\sigma^2}{n\\varepsilon^2}\\to0$ (LGN).<\/li>\n<li>Proporção com $p$ desconhecido: pior caso $p(1-p)\\le\\dfrac14$.<\/li>\n<li>A LGN não \"compensa\" sequências: moedas não têm memória.<\/li><\/ul>\n<h4>TCL<\/h4>\n<ul><li>$\\dfrac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\approx N(0;\\,1)$ para $n$ grande; equivalente: $S_n\\approx N(n\\mu,\\,n\\sigma^2)$.<\/li>\n<li>Tchebyshev dá <b>garantia<\/b>; TCL dá <b>estimativa<\/b> (muito menor).<\/li><\/ul>\n<h4>Normal para a Binomial<\/h4>\n<ul><li>$X\\sim\\text{Bin}(n,p)\\approx N(np,\\,np(1-p))$ se $np$ e $n(1-p)$ forem grandes.<\/li>\n<li><b>Correção de continuidade:<\/b> $P(X\\le k)\\approx\\Phi\\!\\left(\\dfrac{k+0{,}5-np}{\\sigma}\\right)$; $\\;P(X\\ge k)\\approx1-\\Phi\\!\\left(\\dfrac{k-0{,}5-np}{\\sigma}\\right)$.<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Usar a variância como DP ao padronizar.<\/li>\n<li>Corrigir para o lado errado (\"pelo menos 30\" começa em $29{,}5$).<\/li>\n<li>Confundir cota de Tchebyshev com probabilidade real.<\/li><\/ul>", "19": "<p class=\"ideia\"><b>A ideia:<\/b> um estimador é uma receita aplicável a qualquer amostra; a estimativa é o número que saiu desta amostra. Bons estimadores acertam em média (sem viés), oscilam pouco (eficientes) e melhoram com mais dados (consistentes). Balança descalibrada (viés) × balança tremida (variância).<\/p>\n<h4>Vocabulário<\/h4>\n<ul><li>População, amostra, <b>parâmetro<\/b> ($\\mu,\\sigma,p$: fixo, desconhecido) e <b>estatística<\/b> ($\\bar X,S,\\hat p$: varia de amostra para amostra).<\/li>\n<li>Estimador (variável aleatória) × estimativa (número observado).<\/li><\/ul>\n<h4>Propriedades<\/h4>\n<ul><li><b>Viés:<\/b> $\\text{Viés}(\\hat\\theta)=E(\\hat\\theta)-\\theta$. Não viesado: $E(\\hat\\theta)=\\theta$ para todo $\\theta$.<\/li>\n<li>$\\bar X$ é não viesado para $\\mu$; $\\;S^2=\\dfrac{\\sum(X_i-\\bar X)^2}{n-1}$ é não viesado para $\\sigma^2$; dividir por $n$ dá viés $-\\dfrac{\\sigma^2}{n}$.<\/li>\n<li><b>Eficiência:<\/b> entre não viesados, o de menor variância. $\\;EQM=\\operatorname{Var}+\\text{viés}^2$.<\/li>\n<li><b>Consistência:<\/b> $\\hat\\theta$ se concentra em $\\theta$ quando $n\\to\\infty$ (viés e variância $\\to0$).<\/li>\n<li>$\\sum c_iX_i$ é não viesado para $\\mu\\iff\\sum c_i=1$; pesos iguais minimizam a variância.<\/li><\/ul>\n<h4>Erro padrão e t de Student<\/h4>\n<ul><li>$EP(\\bar X)=\\dfrac{\\sigma}{\\sqrt n}$; estimado: $\\dfrac{s}{\\sqrt n}$. Quadruplicar $n$ $\\Rightarrow$ EP cai pela metade.<\/li>\n<li>$\\dfrac{\\bar X-\\mu}{S/\\sqrt n}\\sim t_{n-1}$ (população normal). Caudas mais pesadas: $t_{7;\\,0{,}975}=2{,}3646>1{,}96$.<\/li>\n<li>Quando $n$ cresce, $t\\to$ Normal.<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Dividir por $n$ em vez de $n-1$ em $s$.<\/li>\n<li>Comparar eficiência de viesado com não viesado só pela variância.<\/li>\n<li>Achar que dobrar $n$ corta o EP pela metade (precisa quadruplicar).<\/li><\/ul>", "20": "<p class=\"ideia\"><b>A ideia:<\/b> o IC é uma rede de pesca jogada em volta da estimativa. O \"95%\" é a taxa de acerto do método, não a chance de este intervalo específico conter $\\mu$.<\/p>\n<h4>Forma geral: estimativa $\\pm$ crítico $\\times$ EP<\/h4>\n<ul><li>Média, $\\sigma$ conhecido: $\\bar x\\pm z_{1-\\alpha/2}\\,\\dfrac{\\sigma}{\\sqrt n}$.<\/li>\n<li>Média, $\\sigma$ desconhecido (população normal): $\\bar x\\pm t_{n-1;\\,1-\\alpha/2}\\,\\dfrac{s}{\\sqrt n}$.<\/li>\n<li>Proporção: $\\hat p\\pm z\\sqrt{\\dfrac{\\hat p(1-\\hat p)}{n}}$.<\/li>\n<li>Críticos $z$: 90% → $1{,}645$ · 95% → $1{,}960$ · 99% → $2{,}576$.<\/li><\/ul>\n<h4>Largura<\/h4>\n<ul><li>Mais confiança $\\Rightarrow$ mais largo. Mais $n$ $\\Rightarrow$ mais estreito ($\\propto 1/\\sqrt n$).<\/li>\n<li>Tamanho para margem $E$: $n\\ge\\left(\\dfrac{z\\,\\sigma}{E}\\right)^2$; proporção: $n\\ge\\dfrac{z^2\\,p(1-p)}{E^2}$, pior caso $p=0{,}5$. Arredonde para cima.<\/li><\/ul>\n<h4>Interpretação correta<\/h4>\n<ul><li>\"Em 95% das amostras, o intervalo construído assim contém $\\mu$.\"<\/li>\n<li>Errado: \"$P(\\mu\\in[a;b])=0{,}95$\", \"95% das observações estão no IC\", \"a próxima média cai no IC com 95%\".<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Usar $z$ com $\\sigma$ estimado e $n$ pequeno.<\/li>\n<li>Confundir dispersão da média ($\\sigma/\\sqrt n$) com a das observações ($\\sigma$).<\/li><\/ul>", "21": "<p class=\"ideia\"><b>A ideia:<\/b> um teste é um julgamento. $H_0$ é o réu presumido inocente; só condenamos (rejeitamos) com evidência forte. \"Não rejeitar\" é \"absolvido por falta de provas\", não \"provado inocente\".<\/p>\n<h4>Roteiro<\/h4>\n<ol><li>Hipóteses: <b>$H_0$ com \"$=$\"<\/b>; $H_1$ é o que se quer mostrar ($\\ne$, $>$ ou $<$), decidida <b>antes<\/b> de ver os dados.<\/li>\n<li>Estatística sob $H_0$:<br>média, $\\sigma$ conhecido: $z=\\dfrac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}$ · $\\sigma$ estimado: $t=\\dfrac{\\bar x-\\mu_0}{s/\\sqrt n}$, gl $=n-1$<br>proporção: $z=\\dfrac{\\hat p-p_0}{\\sqrt{p_0(1-p_0)/n}}$ — <b>EP com $p_0$<\/b>.<\/li>\n<li>Decisão: compare com o crítico ou calcule o p-valor.<\/li><\/ol>\n<h4>p-valor<\/h4>\n<ul><li>Probabilidade, sob $H_0$, de um resultado tão ou mais extremo que o observado.<\/li>\n<li>Unilateral: uma cauda. Bilateral: $2\\times$ a cauda.<\/li>\n<li>Rejeita $H_0$ se p-valor $\\le\\alpha$. <b>Não<\/b> é $P(H_0\\text{ verdadeira})$.<\/li><\/ul>\n<h4>Erros e poder<\/h4>\n<ul><li>Tipo I: rejeitar $H_0$ verdadeira (prob. $\\alpha$). Tipo II: não rejeitar $H_0$ falsa (prob. $\\beta$).<\/li>\n<li>Poder $=1-\\beta$. Bilateral: $\\beta\\approx\\Phi\\!\\left(z_{1-\\alpha/2}-\\dfrac{|\\delta|}{EP}\\right)$.<\/li>\n<li>Poder cresce com $n$, $|\\delta|$ e $\\alpha$; cai com $\\sigma$.<\/li>\n<li>$n$ para poder $1-\\beta$: $n\\ge\\left(\\dfrac{(z_{1-\\alpha/2}+z_{1-\\beta})\\,\\sigma}{\\delta}\\right)^2$.<\/li><\/ul>\n<h4>Dualidade<\/h4>\n<ul><li>Teste bilateral a $\\alpha$ rejeita $\\mu_0\\iff\\mu_0$ fora do IC de $1-\\alpha$ (exato para médias).<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Igualdade em $H_1$; trocar para unilateral depois de ver os dados (dobra o $\\alpha$ real).<\/li>\n<li>p-valor bilateral quando $H_1$ tem direção, ou vice-versa.<\/li>\n<li>Usar $\\hat p$ no EP do teste de proporção.<\/li><\/ul>", "22": "<p class=\"ideia\"><b>A ideia:<\/b> o desenho do estudo manda no método. Medir as mesmas unidades antes e depois é pareado (como pesar as mesmas pessoas antes e depois da dieta): a variação entre unidades some ao tirar a diferença.<\/p>\n<h4>Pareado<\/h4>\n<ul><li>$d_i=\\text{antes}-\\text{depois}$; teste t de uma amostra em $d$: $t=\\dfrac{\\bar d}{s_d/\\sqrt n}$, gl $=n-1$.<\/li>\n<li>IC: $\\bar d\\pm t\\,\\dfrac{s_d}{\\sqrt n}$.<\/li><\/ul>\n<h4>Duas amostras independentes (Welch)<\/h4>\n<ul><li>$EP=\\sqrt{\\dfrac{s_1^2}{n_1}+\\dfrac{s_2^2}{n_2}}$; $\\;t=\\dfrac{\\bar x_1-\\bar x_2}{EP}$.<\/li>\n<li>$\\nu=\\dfrac{\\left(\\frac{s_1^2}{n_1}+\\frac{s_2^2}{n_2}\\right)^2}{\\frac{(s_1^2/n_1)^2}{n_1-1}+\\frac{(s_2^2/n_2)^2}{n_2-1}}$, arredondado <b>para baixo<\/b>.<\/li>\n<li>Não supõe variâncias iguais.<\/li><\/ul>\n<h4>Duas proporções<\/h4>\n<ul><li>Teste: $\\hat p_c=\\dfrac{x_1+x_2}{n_1+n_2}$; $\\;EP_0=\\sqrt{\\hat p_c(1-\\hat p_c)\\left(\\dfrac1{n_1}+\\dfrac1{n_2}\\right)}$; $\\;z=\\dfrac{\\hat p_1-\\hat p_2}{EP_0}$.<\/li>\n<li>IC: $(\\hat p_1-\\hat p_2)\\pm z\\sqrt{\\dfrac{\\hat p_1(1-\\hat p_1)}{n_1}+\\dfrac{\\hat p_2(1-\\hat p_2)}{n_2}}$.<\/li>\n<li>Validade: os quatro produtos (sucessos e fracassos de cada grupo) grandes.<\/li>\n<li>Teste (EP combinado) e IC (EPs separados) podem discordar perto da fronteira.<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Tratar dados pareados como independentes: o EP explode e o efeito some.<\/li>\n<li>Arredondar $\\nu$ para cima.<\/li>\n<li>Usar a proporção combinada no IC.<\/li><\/ul>", "23": "<p class=\"ideia\"><b>A ideia:<\/b> uma variável aleatória é uma foto; um processo estocástico é um filme — uma família de variáveis indexada pelo tempo.<\/p>\n<h4>Passeio aleatório<\/h4>\n<ul><li>Passo $+1$ com prob. $p$, $-1$ com prob. $1-p$: $\\;S_n=2B_n-n$, $\\;B_n\\sim\\text{Bin}(n,p)$.<\/li>\n<li>$E(S_n)=n(2p-1)$, $\\;\\operatorname{Var}(S_n)=4np(1-p)$.<\/li>\n<li>$P(S_n=k)=P\\!\\left(B_n=\\dfrac{n+k}{2}\\right)$: zero se $\\frac{n+k}{2}$ não for inteiro (paridade).<\/li><\/ul>\n<h4>Processo de Poisson (taxa $\\lambda$)<\/h4>\n<ul><li>$N(t)\\sim\\text{Poisson}(\\lambda t)$: $\\;P(N(t)=k)=e^{-\\lambda t}\\dfrac{(\\lambda t)^k}{k!}$. Intervalos disjuntos são independentes; só o comprimento importa.<\/li>\n<li>Tempo entre ocorrências $\\sim\\text{Exp}(\\lambda)$; espera pela $k$-ésima $\\sim\\text{Gama}(k,\\lambda)$.<\/li>\n<li>$\\{W_k>t\\}=\\{N(t)\\le k-1\\}$.<\/li>\n<li><b>Superposição:<\/b> fontes independentes somam taxas; cada ocorrência vem da fonte $i$ com prob. $\\dfrac{\\lambda_i}{\\lambda_1+\\lambda_2}$.<\/li>\n<li><b>Afinamento:<\/b> marcar cada ocorrência com prob. $q$ dá Poisson de taxa $q\\lambda$.<\/li><\/ul>\n<h4>Cadeias de Markov<\/h4>\n<ul><li>O próximo estado depende só do atual. Matriz $P$: linha = de onde sai; <b>cada linha soma 1<\/b>.<\/li>\n<li>$\\pi^{(n+1)}=\\pi^{(n)}P$; probabilidade em 2 passos = soma sobre os caminhos.<\/li>\n<li>Estacionária: $\\pi=\\pi P$, $\\;\\sum\\pi_i=1$: fração de tempo em cada estado no longo prazo.<\/li>\n<li>Permanência média num estado $i$: $\\dfrac{1}{1-p_{ii}}$.<\/li><\/ul>\n<h4>Armadilhas<\/h4>\n<ul><li>Somar colunas da matriz em vez de linhas.<\/li>\n<li>Esquecer de converter minutos para horas em $\\lambda t$.<\/li><\/ul>"};
const COLA={"13": ["Exponencial: $P(X>t)=e^{-\\lambda t}$, $\\;E(X)=\\dfrac{1}{\\lambda}$, $\\;\\operatorname{Var}(X)=\\dfrac{1}{\\lambda^2}$", "Falta de memória: $P(X>s+t\\mid X>s)=P(X>t)$", "Gama$(\\alpha,\\lambda)$ = soma de $\\alpha$ exponenciais: $E=\\dfrac{\\alpha}{\\lambda}$, $\\;\\operatorname{Var}=\\dfrac{\\alpha}{\\lambda^2}$", "Weibull: $\\beta<1$ taxa cai, $\\beta=1$ constante, $\\beta>1$ cresce", "Uniforme$(a,b)$: $E=\\dfrac{a+b}{2}$, $\\;\\operatorname{Var}=\\dfrac{(b-a)^2}{12}$"], "14": ["$Z=\\dfrac{X-\\mu}{\\sigma}$, $\\;\\Phi(-z)=1-\\Phi(z)$", "$N(\\mu,\\sigma^2)$: o 2º parâmetro é a <b>variância<\/b>", "$X\\pm Y$ independentes: $\\operatorname{Var}(X\\pm Y)=\\sigma_X^2+\\sigma_Y^2$ (sempre soma)", "$aX+b\\sim N(a\\mu+b,\\;a^2\\sigma^2)$", "Lognormal: mediana $=e^{\\mu}$, média $=e^{\\mu+\\sigma^2/2}$"], "15": ["Marginal de $X$ = soma da <b>linha<\/b>; de $Y$ = soma da coluna", "Contínuo: $f_X(x)=\\displaystyle\\int f(x,y)\\,dy$ (limites da região)", "$k=\\dfrac{1}{\\iint \\text{forma}}$", "Marginais não determinam a conjunta", "Multinomial: $\\dfrac{n!}{n_1!\\cdots n_k!}\\,p_1^{n_1}\\cdots p_k^{n_k}$; cada componente é $\\text{Bin}(n,p_i)$"], "16": ["Independência: $p(x,y)=p_X(x)\\,p_Y(y)$ em <b>todas<\/b> as células; uma falha basta para negar", "Suporte não retangular $\\Rightarrow$ dependentes", "$p_{Y\\mid X}(y\\mid x)=\\dfrac{p(x,y)}{p_X(x)}$: divide pelo que vem <b>depois da barra<\/b>", "$\\min$ de exponenciais independentes: $\\text{Exp}(\\lambda_1+\\lambda_2)$"], "17": ["$E(Y)=\\sum_x E(Y\\mid X=x)\\,p_X(x)$ (esperança iterada)", "$\\operatorname{Cov}(X,Y)=E(XY)-E(X)E(Y)$, $\\;\\rho=\\dfrac{\\operatorname{Cov}}{\\sigma_X\\sigma_Y}$", "$\\operatorname{Var}(X\\pm Y)=\\operatorname{Var}X+\\operatorname{Var}Y\\pm 2\\operatorname{Cov}$", "$\\operatorname{Var}(aX+bY+c)=a^2\\operatorname{Var}X+b^2\\operatorname{Var}Y+2ab\\operatorname{Cov}$", "$\\operatorname{Cov}=0\\not\\Rightarrow$ independência; correlação não é causa"], "18": ["$E(\\bar X)=\\mu$, $\\;DP(\\bar X)=\\dfrac{\\sigma}{\\sqrt n}$", "Tchebyshev: $P(|X-\\mu|\\ge k\\sigma)\\le\\dfrac{1}{k^2}$ (garantia, folgada)", "TCL: $\\bar X\\approx N\\!\\left(\\mu,\\dfrac{\\sigma^2}{n}\\right)$; soma $\\approx N(n\\mu,\\,n\\sigma^2)$", "$\\text{Bin}\\approx N(np,\\,np(1-p))$; \"$\\ge 30$\" → $29{,}5$; \"$\\le 15$\" → $15{,}5$", "Pior caso: $p(1-p)\\le\\dfrac14$"], "19": ["$\\text{Viés}(\\hat\\theta)=E(\\hat\\theta)-\\theta$", "$\\bar X$ e $S^2=\\dfrac{\\sum(X_i-\\bar X)^2}{n-1}$ são não viesados", "Eficiente = menor variância entre os não viesados", "Consistente: viés $\\to0$ e variância $\\to0$", "$EP=\\dfrac{\\sigma}{\\sqrt n}$: quadruplicar $n$ corta pela metade; $\\sigma$ estimado $\\Rightarrow t_{n-1}$"], "20": ["IC = estimativa $\\pm$ crítico $\\times$ EP", "$z$: 90% → $1{,}645$ · 95% → $1{,}960$ · 99% → $2{,}576$", "$\\sigma$ desconhecido: $\\bar x\\pm t_{n-1}\\dfrac{s}{\\sqrt n}$", "Proporção: $\\hat p\\pm z\\sqrt{\\dfrac{\\hat p(1-\\hat p)}{n}}$", "$n\\ge\\left(\\dfrac{z\\,\\sigma}{E}\\right)^2$; proporção sem estimativa: $p=0{,}5$"], "21": ["$H_0$ tem o \"$=$\"; $H_1$ é a afirmação", "Proporção: $z=\\dfrac{\\hat p-p_0}{\\sqrt{p_0(1-p_0)/n}}$ — <b>usa $p_0$<\/b>", "p-valor $\\le\\alpha\\Rightarrow$ rejeita; unilateral: 1 cauda, bilateral: $2\\times$", "Poder $=1-\\beta$: sobe com $n$, $|\\delta|$ e $\\alpha$", "Bilateral rejeita $\\mu_0\\iff\\mu_0$ fora do IC"], "22": ["Mesmas unidades ⟹ <b>pareado<\/b>: $t=\\dfrac{\\bar d}{s_d/\\sqrt n}$", "Welch: $EP=\\sqrt{\\dfrac{s_1^2}{n_1}+\\dfrac{s_2^2}{n_2}}$; $\\nu$ arredonda para baixo", "2 proporções (teste): $\\hat p_c=\\dfrac{x_1+x_2}{n_1+n_2}$ no EP", "IC de $p_1-p_2$: EPs separados"], "23": ["Passeio: $S_n=2B_n-n$, $\\;E=n(2p-1)$, $\\;\\operatorname{Var}=4np(1-p)$", "Poisson: $N(t)\\sim\\text{Poisson}(\\lambda t)$; espera $\\sim\\text{Exp}(\\lambda)$", "Superposição soma taxas; afinamento: $q\\lambda$", "$\\{W_k>t\\}=\\{N(t)\\le k-1\\}$", "Markov: <b>linhas<\/b> somam 1; $\\pi^{(n+1)}=\\pi^{(n)}P$; estacionária $\\pi=\\pi P$"]};
const MAPA="<table class=\"mapa\"><tr><th>Pergunta<\/th><th>Ferramenta<\/th><\/tr>\n<tr><td>Espera sem envelhecer / \"já durou $s$\"<\/td><td>Exponencial + falta de memória<\/td><\/tr>\n<tr><td>Espera pela $k$-ésima ocorrência<\/td><td>Gama$(k,\\lambda)$ ou $\\{W_k>t\\}=\\{N(t)\\le k-1\\}$<\/td><\/tr>\n<tr><td>Envelhecimento / taxa de falha variável<\/td><td>Weibull ($\\beta>1$ cresce)<\/td><\/tr>\n<tr><td>Soma de muitas parcelas / medida com erro<\/td><td>Normal; padronizar e usar $\\Phi$<\/td><\/tr>\n<tr><td>Grandeza positiva assimétrica<\/td><td>Lognormal ($\\ln X$ normal)<\/td><\/tr>\n<tr><td>Tabela conjunta: \"só $X$\"<\/td><td>Marginal = soma da linha<\/td><\/tr>\n<tr><td>\"Dado que…\"<\/td><td>Célula $\\div$ marginal do que está após a barra<\/td><\/tr>\n<tr><td>São independentes?<\/td><td>Fatoração célula a célula / suporte + expressão<\/td><\/tr>\n<tr><td>Média geral a partir de grupos<\/td><td>Esperança iterada<\/td><\/tr>\n<tr><td>Variância de soma/diferença<\/td><td>$\\operatorname{Var}X+\\operatorname{Var}Y\\pm2\\operatorname{Cov}$<\/td><\/tr>\n<tr><td>Garantia sem supor distribuição<\/td><td>Tchebyshev<\/td><\/tr>\n<tr><td>Probabilidade aproximada de soma/média<\/td><td>TCL<\/td><\/tr>\n<tr><td>Binomial com $n$ grande<\/td><td>Normal + correção de continuidade<\/td><\/tr>\n<tr><td>Faixa plausível para $\\mu$ ou $p$<\/td><td>Intervalo de confiança ($z$, $t$ ou proporção)<\/td><\/tr>\n<tr><td>Uma afirmação se sustenta?<\/td><td>Teste de hipóteses e p-valor<\/td><\/tr>\n<tr><td>Mesmas unidades antes/depois<\/td><td>Teste t pareado<\/td><\/tr>\n<tr><td>Dois grupos independentes<\/td><td>Welch / duas proporções<\/td><\/tr>\n<tr><td>Contagem de eventos no tempo<\/td><td>Processo de Poisson<\/td><\/tr>\n<tr><td>Sobe/desce a cada passo<\/td><td>Passeio aleatório ($S_n=2B_n-n$)<\/td><\/tr>\n<tr><td>Estados que mudam no tempo<\/td><td>Cadeia de Markov ($\\pi^{(n+1)}=\\pi^{(n)}P$)<\/td><\/tr><\/table>";
const CARDS=[[13, "Uniforme$(a,b)$: densidade, média e variância", "$f(x)=\\dfrac{1}{b-a}$ em $[a,b]$<br>$E(X)=\\dfrac{a+b}{2}$, $\\;\\operatorname{Var}(X)=\\dfrac{(b-a)^2}{12}$"], [13, "Exponencial$(\\lambda)$: $P(X>t)$, média e variância", "$P(X>t)=e^{-\\lambda t}$<br>$E(X)=\\dfrac1\\lambda$, $\\;\\operatorname{Var}(X)=\\dfrac{1}{\\lambda^2}$"], [13, "O que é a falta de memória?", "$P(X>s+t\\mid X>s)=P(X>t)$<br>Quem já durou $s$ tem a mesma chance de durar mais $t$ que um item novo. Só a Exponencial (contínua) tem essa propriedade."], [13, "Mediana da Exponencial$(\\lambda)$", "$m=\\dfrac{\\ln 2}{\\lambda}\\approx\\dfrac{0{,}693}{\\lambda}$ (abaixo da média $1/\\lambda$)"], [13, "Gama$(\\alpha,\\lambda)$: o que representa? Média e variância?", "Soma de $\\alpha$ exponenciais independentes de taxa $\\lambda$ = espera pela $\\alpha$-ésima ocorrência de um Poisson.<br>$E=\\dfrac{\\alpha}{\\lambda}$, $\\;\\operatorname{Var}=\\dfrac{\\alpha}{\\lambda^2}$"], [13, "$P(\\text{Gama}(\\alpha,\\lambda)>t)$ para $\\alpha$ inteiro", "$e^{-\\lambda t}\\displaystyle\\sum_{k=0}^{\\alpha-1}\\frac{(\\lambda t)^k}{k!}$<br>= P(menos de $\\alpha$ ocorrências até $t$)"], [13, "Weibull$(\\eta,\\beta)$: $F(x)$ e taxa de falha", "$F(x)=1-e^{-(x/\\eta)^\\beta}$<br>$h(x)=\\dfrac{\\beta}{\\eta}\\left(\\dfrac{x}{\\eta}\\right)^{\\beta-1}$"], [13, "O que $\\beta$ diz na Weibull?", "$\\beta<1$: taxa de falha cai (mortalidade infantil)<br>$\\beta=1$: constante (= Exponencial)<br>$\\beta>1$: cresce (desgaste)"], [13, "Definição de taxa de falha $h(t)$", "$h(t)=\\dfrac{f(t)}{S(t)}$, com $S(t)=P(X>t)$: risco instantâneo de falhar em $t$, sabendo que sobreviveu até $t$."], [14, "Como padronizar uma Normal?", "$Z=\\dfrac{X-\\mu}{\\sigma}\\sim N(0;\\,1)$<br>$P(X\\le x)=\\Phi\\!\\left(\\dfrac{x-\\mu}{\\sigma}\\right)$"], [14, "$\\Phi(-z)$ em função de $\\Phi(z)$", "$\\Phi(-z)=1-\\Phi(z)$ (simetria)"], [14, "Quantis $z$ mais usados", "$z_{0{,}90}=1{,}2816$<br>$z_{0{,}95}=1{,}645$<br>$z_{0{,}975}=1{,}960$<br>$z_{0{,}995}=2{,}576$"], [14, "Distribuição de $X-Y$ com $X$, $Y$ normais independentes", "$N\\!\\left(\\mu_X-\\mu_Y,\\;\\sigma_X^2+\\sigma_Y^2\\right)$<br>A variância <b>soma<\/b>."], [14, "Distribuição de $aX+b$, com $X\\sim N(\\mu,\\sigma^2)$", "$N(a\\mu+b,\\;a^2\\sigma^2)$"], [14, "Lognormal$(\\mu,\\sigma)$: mediana e média", "Mediana $=e^{\\mu}$<br>Média $=e^{\\mu+\\sigma^2/2}$"], [14, "Como calcular $P(X>x)$ na Lognormal?", "$1-\\Phi\\!\\left(\\dfrac{\\ln x-\\mu}{\\sigma}\\right)$: tire o log e use a Normal."], [15, "Como obter a marginal de $X$ numa tabela conjunta?", "Some cada <b>linha<\/b>: $p_X(x)=\\sum_y p(x,y)$"], [15, "Como obter a marginal no contínuo?", "$f_X(x)=\\displaystyle\\int f(x,y)\\,dy$, com os limites de $y$ dados pela região para $x$ fixo."], [15, "Como achar a constante $k$ de uma densidade conjunta?", "Impor $\\iint f=1$: $\\;k=\\dfrac{1}{\\text{integral da forma}}$"], [15, "As marginais determinam a conjunta?", "Não. Marginais iguais admitem conjuntas muito diferentes (ex.: $P(X=Y)$ pode ir de 0 a 1)."], [15, "Fórmula da Multinomial", "$P(n_1,\\dots,n_k)=\\dfrac{n!}{n_1!\\cdots n_k!}\\,p_1^{n_1}\\cdots p_k^{n_k}$"], [15, "Distribuição de uma componente da Multinomial", "$\\text{Bin}(n,p_i)$. As componentes não são independentes (somam $n$)."], [16, "Critério de independência (discreto)", "$p(x,y)=p_X(x)\\,p_Y(y)$ em <b>todas<\/b> as células. Uma célula que falha nega a independência."], [16, "Suporte não retangular (ex.: $0<y<x<1$): $X$ e $Y$ podem ser independentes?", "Não. Há pontos com $f=0$ onde as duas marginais são positivas."], [16, "Fórmula da condicional $p_{Y\\mid X}(y\\mid x)$", "$p_{Y\\mid X}(y\\mid x)=\\dfrac{p(x,y)}{p_X(x)}$<br>Divide pela marginal de quem está <b>depois<\/b> da barra."], [16, "Densidade $4xy$ no quadrado: independentes?", "Sim: suporte retangular e $4xy=(2x)(2y)$."], [16, "Densidade $x+y$ no quadrado: independentes?", "Não: a soma não separa em $g(x)\\,h(y)$, apesar do suporte retangular."], [16, "Mínimo de $\\text{Exp}(\\lambda_1)$ e $\\text{Exp}(\\lambda_2)$ independentes", "$\\text{Exp}(\\lambda_1+\\lambda_2)$: em série, as taxas somam."], [17, "Esperança iterada", "$E(Y)=E[E(Y\\mid X)]=\\sum_x E(Y\\mid X=x)\\,p_X(x)$"], [17, "$E(Y\\mid X=x)$ × $E(Y\\mid X)$", "O primeiro é um <b>número<\/b>; o segundo é uma <b>variável aleatória<\/b> (função de $X$)."], [17, "Fórmula prática da covariância", "$\\operatorname{Cov}(X,Y)=E(XY)-E(X)\\,E(Y)$"], [17, "Correlação $\\rho$", "$\\rho=\\dfrac{\\operatorname{Cov}(X,Y)}{\\sigma_X\\,\\sigma_Y}$, entre $-1$ e $1$, sem unidade."], [17, "$\\operatorname{Var}(X+Y)$ e $\\operatorname{Var}(X-Y)$", "$\\operatorname{Var}X+\\operatorname{Var}Y+2\\operatorname{Cov}$<br>$\\operatorname{Var}X+\\operatorname{Var}Y-2\\operatorname{Cov}$"], [17, "$\\operatorname{Cov}(aX+b,\\;cY+d)$", "$ac\\operatorname{Cov}(X,Y)$. Constantes somadas somem."], [17, "$\\operatorname{Cov}=0$ implica independência?", "Não. Só independência $\\Rightarrow\\operatorname{Cov}=0$. $\\operatorname{Cov}=0$ indica ausência de associação <b>linear<\/b>."], [17, "Soma de $\\text{Poisson}(\\lambda_1)$ e $\\text{Poisson}(\\lambda_2)$ independentes", "$\\text{Poisson}(\\lambda_1+\\lambda_2)$"], [18, "Desigualdade de Tchebyshev", "$P(|X-\\mu|\\ge k\\sigma)\\le\\dfrac{1}{k^2}$, para qualquer distribuição."], [18, "Tchebyshev para a média amostral", "$P(|\\bar X-\\mu|\\ge\\varepsilon)\\le\\dfrac{\\sigma^2}{n\\,\\varepsilon^2}$"], [18, "$E$ e $\\operatorname{Var}$ da média amostral", "$E(\\bar X)=\\mu$, $\\;\\operatorname{Var}(\\bar X)=\\dfrac{\\sigma^2}{n}$, $\\;DP=\\dfrac{\\sigma}{\\sqrt n}$"], [18, "Enunciado do TCL", "Para $n$ grande, $\\dfrac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\approx N(0;\\,1)$, qualquer que seja a distribuição (com variância finita)."], [18, "Quando aproximar a Binomial pela Normal?", "Quando $np$ e $n(1-p)$ são grandes ($\\ge5$ ou $\\ge10$). Use $N(np,\\;np(1-p))$."], [18, "Correção de continuidade para $P(X\\ge30)$", "$P(X\\ge30)\\approx P(Y\\ge29{,}5)$: a barra do 30 começa em $29{,}5$."], [18, "Correção de continuidade para $P(X\\le15)$", "$P(X\\le15)\\approx P(Y\\le15{,}5)$"], [18, "Pior caso de $p(1-p)$", "$\\dfrac14$, em $p=0{,}5$."], [19, "Parâmetro × estatística", "Parâmetro: número fixo e desconhecido da população ($\\mu,\\sigma,p$).<br>Estatística: função da amostra ($\\bar X,S,\\hat p$), varia de amostra para amostra."], [19, "Definição de viés", "$\\text{Viés}(\\hat\\theta)=E(\\hat\\theta)-\\theta$<br>Não viesado: $E(\\hat\\theta)=\\theta$ para todo $\\theta$."], [19, "Por que $S^2$ divide por $n-1$?", "Para ser não viesado: $E(S^2)=\\sigma^2$. Dividir por $n$ dá viés $-\\dfrac{\\sigma^2}{n}$."], [19, "Estimador eficiente", "Entre os não viesados, o de menor variância."], [19, "Estimador consistente", "Concentra-se no parâmetro quando $n\\to\\infty$ (viés e variância vão a zero)."], [19, "Quando $\\sum c_iX_i$ é não viesado para $\\mu$?", "Quando $\\sum c_i=1$. Pesos iguais ($\\bar X$) dão a menor variância."], [19, "Erro padrão da média", "$EP=\\dfrac{\\sigma}{\\sqrt n}$ (estimado: $\\dfrac{s}{\\sqrt n}$). Para cortar pela metade, quadruplique $n$."], [19, "Quando usar a t de Student?", "Média com $\\sigma$ desconhecido, estimado por $S$, população normal: $\\dfrac{\\bar X-\\mu}{S/\\sqrt n}\\sim t_{n-1}$"], [20, "Forma geral de um IC", "estimativa $\\pm$ valor crítico $\\times$ erro padrão"], [20, "IC para $\\mu$ com $\\sigma$ desconhecido", "$\\bar x\\pm t_{n-1;\\,1-\\alpha/2}\\,\\dfrac{s}{\\sqrt n}$"], [20, "IC para proporção", "$\\hat p\\pm z\\sqrt{\\dfrac{\\hat p(1-\\hat p)}{n}}$"], [20, "Interpretação correta do IC de 95%", "Em 95% das amostras, o intervalo construído pelo mesmo método contém $\\mu$."], [20, "Tamanho de amostra para margem $E$ (média)", "$n\\ge\\left(\\dfrac{z\\,\\sigma}{E}\\right)^2$, arredondando para cima."], [20, "Tamanho de amostra para proporção sem estimativa", "$n\\ge\\dfrac{z^2\\cdot0{,}25}{E^2}$ (pior caso $p=0{,}5$)"], [20, "Efeito do nível de confiança na largura", "Mais confiança $\\Rightarrow$ crítico maior $\\Rightarrow$ intervalo mais largo."], [21, "Onde fica a igualdade nas hipóteses?", "Sempre em $H_0$. $H_1$ é a afirmação que se quer mostrar."], [21, "Definição de p-valor", "Probabilidade, sob $H_0$, de um resultado tão ou mais extremo que o observado."], [21, "Erro tipo I e tipo II", "Tipo I: rejeitar $H_0$ verdadeira ($\\alpha$).<br>Tipo II: não rejeitar $H_0$ falsa ($\\beta$)."], [21, "Poder do teste", "$1-\\beta=P(\\text{rejeitar }H_0\\mid H_1\\text{ verdadeira})$"], [21, "Estatística do teste de proporção", "$z=\\dfrac{\\hat p-p_0}{\\sqrt{\\dfrac{p_0(1-p_0)}{n}}}$ — o EP usa $p_0$."], [21, "Dualidade teste–IC", "O teste bilateral a $\\alpha$ rejeita $\\mu_0\\iff\\mu_0$ está fora do IC de $1-\\alpha$."], [21, "O que aumenta o poder?", "Maior $n$, maior $|\\mu_1-\\mu_0|$, maior $\\alpha$, menor $\\sigma$."], [21, "$n$ para atingir um poder $1-\\beta$", "$n\\ge\\left(\\dfrac{(z_{1-\\alpha/2}+z_{1-\\beta})\\,\\sigma}{\\delta}\\right)^2$"], [22, "Quando o teste é pareado?", "Quando as mesmas unidades são medidas duas vezes (antes/depois). Trabalhe com as diferenças."], [22, "Estatística do teste pareado", "$t=\\dfrac{\\bar d}{s_d/\\sqrt n}$, gl $=n-1$"], [22, "Erro padrão de Welch", "$EP=\\sqrt{\\dfrac{s_1^2}{n_1}+\\dfrac{s_2^2}{n_2}}$"], [22, "Graus de liberdade de Welch", "$\\nu=\\dfrac{(a+b)^2}{\\dfrac{a^2}{n_1-1}+\\dfrac{b^2}{n_2-1}}$, com $a=\\dfrac{s_1^2}{n_1}$, $b=\\dfrac{s_2^2}{n_2}$; arredonde para baixo."], [22, "EP do teste de duas proporções", "$\\sqrt{\\hat p_c(1-\\hat p_c)\\left(\\dfrac1{n_1}+\\dfrac1{n_2}\\right)}$, com $\\hat p_c=\\dfrac{x_1+x_2}{n_1+n_2}$"], [22, "EP do IC para $p_1-p_2$", "$\\sqrt{\\dfrac{\\hat p_1(1-\\hat p_1)}{n_1}+\\dfrac{\\hat p_2(1-\\hat p_2)}{n_2}}$ — sem combinar."], [23, "Passeio aleatório: $E(S_n)$ e $\\operatorname{Var}(S_n)$", "$E(S_n)=n(2p-1)$<br>$\\operatorname{Var}(S_n)=4np(1-p)$"], [23, "Relação do passeio com a Binomial", "$S_n=2B_n-n$, com $B_n\\sim\\text{Bin}(n,p)$ = número de passos para cima."], [23, "Processo de Poisson: distribuição de $N(t)$", "$\\text{Poisson}(\\lambda t)$: $\\;P(N(t)=k)=e^{-\\lambda t}\\dfrac{(\\lambda t)^k}{k!}$"], [23, "Tempo entre ocorrências num Poisson", "$\\text{Exp}(\\lambda)$, média $\\dfrac1\\lambda$."], [23, "Superposição de processos de Poisson", "Fontes independentes: taxas somam. Cada ocorrência vem da fonte $i$ com prob. $\\dfrac{\\lambda_i}{\\sum\\lambda}$."], [23, "Afinamento de um Poisson", "Marcar cada ocorrência com prob. $q$ dá Poisson de taxa $q\\lambda$."], [23, "$\\{W_2>t\\}$ em termos de $N(t)$", "$\\{N(t)\\le1\\}$: a 2ª ocorrência chega depois de $t$ $\\iff$ houve no máximo 1 até $t$."], [23, "Matriz de transição: o que soma 1?", "Cada <b>linha<\/b> (as probabilidades de sair de um estado)."], [23, "Como achar a distribuição estacionária?", "Resolver $\\pi=\\pi P$ com $\\sum\\pi_i=1$."], [23, "Tempo médio de permanência num estado $i$", "$\\dfrac{1}{1-p_{ii}}$ passos."]];
const QUIZ=[[13, "Um componente com vida Exponencial já funcionou 1000 h. A probabilidade de durar mais 200 h é:", ["Igual à de um componente novo durar 200 h", "Menor que a de um novo, porque ele está gasto", "Maior que a de um novo, porque provou ser bom", "Impossível de calcular sem saber $\\lambda$ e a idade"], 0, "Falta de memória: $P(X>1200\\mid X>1000)=P(X>200)$. A Exponencial não envelhece."], [13, "A vida de um item tem taxa de falha crescente com o uso. O modelo mais adequado é:", ["Exponencial", "Weibull com $\\beta>1$", "Weibull com $\\beta<1$", "Uniforme"], 1, "$\\beta>1$ dá $h(x)$ crescente (desgaste). A Exponencial tem taxa constante; $\\beta<1$ dá taxa decrescente."], [13, "Se $X\\sim\\text{Exp}(\\lambda=0{,}5)$, então:", ["$E(X)=0{,}5$ e $\\operatorname{Var}(X)=0{,}25$", "$E(X)=2$ e $\\operatorname{Var}(X)=2$", "$E(X)=2$ e $\\operatorname{Var}(X)=4$", "$E(X)=0{,}5$ e $\\operatorname{Var}(X)=2$"], 2, "$E(X)=\\dfrac1\\lambda=2$ e $\\operatorname{Var}(X)=\\dfrac1{\\lambda^2}=4$. Usar $1/\\lambda$ como variância é um erro clássico."], [13, "O tempo até a 3ª ocorrência de um processo de Poisson de taxa $\\lambda$ tem distribuição:", ["$\\text{Exp}(3\\lambda)$", "$\\text{Gama}(3,\\lambda)$", "$\\text{Poisson}(3\\lambda)$", "Weibull com $\\beta=3$"], 1, "É a soma de 3 tempos entre ocorrências, cada um $\\text{Exp}(\\lambda)$, independentes: $\\text{Gama}(3,\\lambda)$."], [13, "A Weibull com $\\beta=1$ é:", ["A Normal", "A Exponencial", "A Uniforme", "A Gama de forma 2"], 1, "Com $\\beta=1$, $F(x)=1-e^{-x/\\eta}$: Exponencial de taxa $1/\\eta$, com $h(x)$ constante."], [13, "A taxa de falha $h(t)$ mede:", ["A probabilidade de falhar até $t$", "A densidade $f(t)$", "O risco instantâneo de falhar em $t$, sabendo que sobreviveu até $t$", "O tempo médio até a falha"], 2, "$h(t)=\\dfrac{f(t)}{S(t)}$: é condicional à sobrevivência até $t$."], [14, "Em $X\\sim N(10;\\,4)$, o desvio padrão de $X$ é:", ["$4$", "$2$", "$16$", "$\\sqrt{10}$"], 1, "Na notação $N(\\mu,\\sigma^2)$, o segundo parâmetro é a variância: $\\sigma=\\sqrt4=2$."], [14, "$X\\sim N(50;\\,4)$ e $Y\\sim N(30;\\,9)$, independentes. $\\operatorname{Var}(X-Y)$ é:", ["$5$", "$13$", "$-5$", "$\\sqrt{13}$"], 1, "Variâncias somam também na diferença: $4+9=13$."], [14, "O valor ultrapassado por apenas 5% de uma $N(\\mu,\\sigma^2)$ é:", ["$\\mu+1{,}96\\,\\sigma$", "$\\mu+1{,}645\\,\\sigma$", "$\\mu-1{,}645\\,\\sigma$", "$\\mu+2{,}576\\,\\sigma$"], 1, "Cauda de 5% de um lado só: quantil $0{,}95$ = $1{,}645$. O $1{,}96$ deixa 2,5% de cada lado."], [14, "Numa Lognormal, a média em relação à mediana é:", ["Igual", "Sempre maior", "Sempre menor", "Depende do sinal de $\\mu$"], 1, "Média $=e^{\\mu+\\sigma^2/2}>e^{\\mu}=$ mediana, porque $\\sigma^2>0$. A cauda direita puxa a média."], [14, "Somam-se três parcelas independentes, cada uma com DP $0{,}3$. O DP do total é:", ["$0{,}9$", "$0{,}3\\sqrt3\\approx0{,}52$", "$0{,}27$", "$0{,}1$"], 1, "$\\operatorname{Var}=3\\times0{,}09=0{,}27\\Rightarrow DP=\\sqrt{0{,}27}\\approx0{,}52$. Somar DPs ($0{,}9$) é o erro clássico."], [14, "Para $X\\sim N(\\mu,\\sigma^2)$, $Y=3X+2$ tem distribuição:", ["$N(3\\mu+2,\\;3\\sigma^2)$", "$N(3\\mu+2,\\;9\\sigma^2)$", "$N(3\\mu,\\;9\\sigma^2+2)$", "$N(\\mu+2,\\;\\sigma^2)$"], 1, "$aX+b\\sim N(a\\mu+b,\\;a^2\\sigma^2)$: o coeficiente sai ao quadrado e a constante não afeta a variância."], [15, "Numa tabela conjunta de $X$ (linhas) e $Y$ (colunas), a marginal de $X$ se obtém:", ["Somando cada coluna", "Somando cada linha", "Multiplicando as marginais", "Dividindo pela soma total"], 1, "Somar a linha $x$ junta todas as formas de $X=x$ acontecer, qualquer que seja $Y$."], [15, "Se conhecemos as duas marginais, então:", ["A conjunta fica determinada", "A conjunta fica determinada se forem discretas", "Em geral a conjunta não fica determinada", "As variáveis são independentes"], 2, "Marginais iguais admitem conjuntas muito diferentes. Só sob independência a conjunta é o produto."], [15, "Para $f(x,y)=kx$ em $0<y<x<1$, a marginal de $X$ se obtém integrando $y$ de:", ["$0$ a $1$", "$0$ a $x$", "$x$ a $1$", "$y$ a $1$"], 1, "Para $x$ fixo, $y$ vai de $0$ até $x$ (a região é o triângulo abaixo da diagonal)."], [15, "Numa Multinomial com $n$ ensaios, a contagem de uma categoria com probabilidade $p_i$ é:", ["$\\text{Poisson}(np_i)$", "$\\text{Bin}(n,p_i)$", "Uniforme", "Independente das demais contagens"], 1, "Cada ensaio cai ou não na categoria $i$, com prob. $p_i$: Binomial. Mas as contagens somam $n$, logo não são independentes."], [15, "Com densidade conjunta constante numa região, a probabilidade de uma sub-região é:", ["Sempre $1/2$", "Área da sub-região $\\times$ valor da densidade", "Perímetro $\\times$ densidade", "Impossível sem integrar"], 1, "Integral de constante = constante $\\times$ área."], [16, "Numa tabela, a célula $(0{,}0)$ satisfaz $p(0;0)=p_X(0)\\,p_Y(0)$. Pode-se concluir:", ["$X$ e $Y$ são independentes", "$X$ e $Y$ não são independentes", "Nada ainda: é preciso conferir todas as células", "$\\operatorname{Cov}(X,Y)=0$"], 2, "Para afirmar independência, todas as células têm de fatorar. Para negar, basta uma."], [16, "Uma densidade positiva só no triângulo $0<y<x<1$. Então $X$ e $Y$:", ["São independentes", "Não são independentes", "São independentes se a densidade for constante", "Têm correlação zero"], 1, "Suporte não retangular $\\Rightarrow$ dependência: existe $(x,y)$ com $f=0$ e marginais positivas."], [16, "$p_{X\\mid Y}(2\\mid1)$ é calculada como:", ["$\\dfrac{p(2;1)}{p_X(2)}$", "$\\dfrac{p(2;1)}{p_Y(1)}$", "$p_X(2)\\,p_Y(1)$", "$p(2;1)$"], 1, "Divide-se pela marginal de quem está depois da barra: $Y=1$."], [16, "$X$ e $Y$ são independentes se, e somente se:", ["$\\operatorname{Cov}(X,Y)=0$", "A condicional de $Y$ dado $X=x$ é igual à marginal de $Y$ para todo $x$", "$E(XY)=0$", "As marginais são iguais"], 1, "Independência $\\iff$ saber $X$ não muda a distribuição de $Y$. $\\operatorname{Cov}=0$ é necessário, mas não suficiente."], [16, "$X\\sim\\text{Exp}(0{,}1)$ e $Y\\sim\\text{Exp}(0{,}2)$ independentes. $\\min(X,Y)$ é:", ["$\\text{Exp}(0{,}1)$", "$\\text{Exp}(0{,}3)$", "$\\text{Exp}(0{,}15)$", "$\\text{Gama}(2;\\,0{,}3)$"], 1, "$P(\\min>t)=e^{-0{,}1t}\\,e^{-0{,}2t}=e^{-0{,}3t}$: as taxas somam."], [16, "$f(x,y)=x+y$ em $0<x,y<1$. $X$ e $Y$ são independentes?", ["Sim, porque o suporte é retangular", "Não, porque a expressão não separa em $g(x)\\,h(y)$", "Sim, porque as marginais são iguais", "Não dá para saber"], 1, "Suporte retangular é necessário, mas a expressão também precisa fatorar. $x+y$ não fatora."], [17, "Turno A (60% da produção) tem 2 defeitos/lote em média; turno B (40%) tem 5. O número esperado de defeitos num lote sorteado é:", ["$3{,}5$", "$3{,}2$", "$7$", "$2{,}6$"], 1, "Esperança iterada: $0{,}6\\times2+0{,}4\\times5=3{,}2$."], [17, "Se $\\operatorname{Cov}(X,Y)=0$, então:", ["$X$ e $Y$ são independentes", "$X$ e $Y$ não têm associação linear", "$\\operatorname{Var}(X+Y)=0$", "$\\rho=1$"], 1, "Covariância zero só descarta associação linear. Pode haver dependência não linear."], [17, "$\\operatorname{Var}(X-Y)$ é igual a:", ["$\\operatorname{Var}X-\\operatorname{Var}Y$", "$\\operatorname{Var}X+\\operatorname{Var}Y-2\\operatorname{Cov}(X,Y)$", "$\\operatorname{Var}X-\\operatorname{Var}Y-2\\operatorname{Cov}(X,Y)$", "$\\operatorname{Var}X+\\operatorname{Var}Y+2\\operatorname{Cov}(X,Y)$"], 1, "$\\operatorname{Var}(X-Y)=\\operatorname{Var}X+(-1)^2\\operatorname{Var}Y+2(1)(-1)\\operatorname{Cov}$."], [17, "$\\operatorname{Cov}(2X+3,\\;-Y+1)$ é igual a:", ["$-2\\operatorname{Cov}(X,Y)$", "$2\\operatorname{Cov}(X,Y)+3$", "$6\\operatorname{Cov}(X,Y)$", "$-2\\operatorname{Cov}(X,Y)+3$"], 0, "$\\operatorname{Cov}(aX+b,\\,cY+d)=ac\\operatorname{Cov}(X,Y)=2\\cdot(-1)\\operatorname{Cov}$. Constantes somadas somem."], [17, "Uma correlação $\\rho=0{,}9$ entre $X$ e $Y$ permite concluir que:", ["$X$ causa $Y$", "$Y$ causa $X$", "Há forte associação linear positiva", "São independentes"], 2, "Correlação mede associação linear, sem direção causal."], [17, "$E(Y\\mid X)$ é:", ["Um número", "Uma variável aleatória (função de $X$)", "Sempre igual a $E(Y)$", "A covariância dividida por $\\operatorname{Var}X$"], 1, "$E(Y\\mid X=x)$ é número; $E(Y\\mid X)=\\psi(X)$ é variável aleatória. Só é constante sob independência."], [17, "$X\\sim\\text{Poisson}(2)$ e $Y\\sim\\text{Poisson}(3)$ independentes. $X+Y$ é:", ["$\\text{Poisson}(5)$", "$\\text{Poisson}(6)$", "$\\text{Bin}(5;\\,0{,}5)$", "$N(5;\\,5)$"], 0, "Propriedade reprodutiva: as taxas somam."], [18, "Pela Lei dos Grandes Números, após 10 coroas seguidas numa moeda honesta:", ["A chance de cara aumenta", "A chance de cara continua $1/2$", "A chance de coroa aumenta", "A moeda deixa de ser honesta"], 1, "A LGN fala da proporção a longo prazo, não de compensação. Os lançamentos são independentes."], [18, "A desigualdade de Tchebyshev:", ["Exige população normal", "Dá uma cota válida para qualquer distribuição com variância finita", "Dá o valor exato da probabilidade", "Só vale para $n>30$"], 1, "Ela é universal, por isso costuma ser bem folgada."], [18, "Ao quadruplicar $n$, o desvio padrão de $\\bar X$:", ["Cai para $1/4$", "Cai para $1/2$", "Fica igual", "Dobra"], 1, "$DP(\\bar X)=\\dfrac{\\sigma}{\\sqrt n}$ e $\\sqrt4=2$."], [18, "O TCL afirma que, para $n$ grande:", ["Os dados ficam normais", "A média amostral tem distribuição aproximadamente normal", "A variância amostral é zero", "$\\bar X=\\mu$ exatamente"], 1, "Quem fica normal é a distribuição de $\\bar X$ (ou da soma), não os dados individuais."], [18, "Na aproximação normal de $X\\sim\\text{Bin}(n,p)$, $P(X\\ge30)$ corresponde a:", ["$P(Y\\ge30{,}5)$", "$P(Y\\ge29{,}5)$", "$P(Y>30)$", "$P(Y\\le29{,}5)$"], 1, "\"Pelo menos 30\" inclui a barra do 30 inteira, que começa em $29{,}5$."], [18, "Comparando a cota de Tchebyshev com a estimativa do TCL para a mesma probabilidade:", ["São sempre iguais", "Tchebyshev costuma ser bem maior (é uma garantia)", "O TCL é sempre maior", "Tchebyshev é sempre menor"], 1, "Tchebyshev cobre o pior caso entre todas as distribuições; o TCL estima o caso concreto."], [19, "Um estimador é não viesado quando:", ["Sua variância é zero", "Sua esperança é igual ao parâmetro, para todo valor do parâmetro", "Acerta o parâmetro em toda amostra", "Tem a menor variância possível"], 1, "$\\text{Viés}=E(\\hat\\theta)-\\theta=0$. Não viesado significa acertar em média, não em toda amostra."], [19, "$T=\\dfrac{X_1+2X_2+3X_3}{6}$ é estimador de $\\mu$:", ["Viesado", "Não viesado, mas menos eficiente que $\\bar X$", "Não viesado e mais eficiente que $\\bar X$", "Inconsistente e viesado"], 1, "Pesos somam 1 $\\Rightarrow$ não viesado. $\\operatorname{Var}(T)=\\dfrac{(1+4+9)\\sigma^2}{36}=\\dfrac{14\\sigma^2}{36}>\\dfrac{\\sigma^2}{3}=\\dfrac{12\\sigma^2}{36}$."], [19, "Por que $s^2$ usa $n-1$ no denominador?", ["Para dar um número maior", "Para ser não viesado para $\\sigma^2$", "Porque $n$ pode ser zero", "Por convenção, sem razão"], 1, "$E\\left[\\sum(X_i-\\bar X)^2\\right]=(n-1)\\sigma^2$. Dividir por $n$ dá viés $-\\dfrac{\\sigma^2}{n}$."], [19, "$\\dfrac{X_1+\\cdots+X_n}{n+1}$ como estimador de $\\mu$ é:", ["Não viesado e consistente", "Viesado, mas consistente", "Viesado e inconsistente", "Não viesado e inconsistente"], 1, "$E=\\dfrac{n\\mu}{n+1}\\ne\\mu$ (viés $-\\dfrac{\\mu}{n+1}$), mas viés e variância $\\to0$ quando $n\\to\\infty$."], [19, "A estatística $\\dfrac{\\bar X-\\mu}{S/\\sqrt n}$, com população normal, tem distribuição:", ["$N(0;\\,1)$", "$t$ de Student com $n-1$ graus de liberdade", "$t$ com $n$ graus de liberdade", "Qui-quadrado"], 1, "Trocar $\\sigma$ por $S$ acrescenta incerteza: $t_{n-1}$, com caudas mais pesadas."], [19, "Um parâmetro é:", ["Um número calculado da amostra", "Uma característica fixa (e em geral desconhecida) da população", "Uma variável aleatória", "Sempre igual à estatística"], 1, "O parâmetro ($\\mu,\\sigma,p$) é fixo; a estatística ($\\bar X,S,\\hat p$) varia de amostra para amostra."], [20, "Um IC de 95% para $\\mu$ deu $[48{,}1;\\;51{,}9]$. A interpretação correta é:", ["$P(48{,}1\\le\\mu\\le51{,}9)=0{,}95$", "95% das observações estão no intervalo", "O método acerta $\\mu$ em 95% das amostras", "A próxima média amostral cai no intervalo com 95%"], 2, "Depois de observado, o intervalo contém $\\mu$ ou não. Os 95% descrevem o procedimento repetido."], [20, "Mantidos os dados, passar de 95% para 99% de confiança:", ["Estreita o IC", "Alarga o IC", "Não muda o IC", "Muda o centro do IC"], 1, "O crítico sobe de $1{,}96$ para $2{,}576$: mais confiança custa precisão."], [20, "Com $\\sigma$ desconhecido, $n=10$ e população normal, o IC para $\\mu$ usa:", ["$z=1{,}96$", "$t$ com 9 gl", "$t$ com 10 gl", "$z=1{,}645$"], 1, "Estima-se $\\sigma$ por $s$: $t$ com $n-1=9$ graus de liberdade."], [20, "Para reduzir a margem de erro à metade, mantida a confiança, deve-se:", ["Dobrar $n$", "Quadruplicar $n$", "Reduzir $n$ à metade", "Usar $z$ no lugar de $t$"], 1, "A margem é proporcional a $\\dfrac{1}{\\sqrt n}$."], [20, "Ao dimensionar $n$ para uma proporção sem estimativa prévia, usa-se:", ["$p=0$", "$p=0{,}5$", "$p=1$", "$p=0{,}1$"], 1, "$p(1-p)$ é máximo em $0{,}5$: garante a margem para qualquer $p$ verdadeiro."], [20, "O IC de proporção usa o erro padrão:", ["$\\sqrt{\\dfrac{p_0(1-p_0)}{n}}$", "$\\sqrt{\\dfrac{\\hat p(1-\\hat p)}{n}}$", "$\\dfrac{\\hat p}{\\sqrt n}$", "$\\sqrt{\\dfrac{\\hat p}{n}}$"], 1, "No IC não há $p_0$; usa-se a estimativa $\\hat p$. No teste, usa-se $p_0$."], [21, "Quer-se mostrar que a proporção de defeitos caiu abaixo de $0{,}1$. As hipóteses são:", ["$H_0: p<0{,}1$ vs $H_1: p=0{,}1$", "$H_0: p=0{,}1$ vs $H_1: p<0{,}1$", "$H_0: p=0{,}1$ vs $H_1: p\\ne0{,}1$", "$H_0: p\\ne0{,}1$ vs $H_1: p=0{,}1$"], 1, "A igualdade fica em $H_0$; $H_1$ traz a afirmação a ser mostrada."], [21, "Um p-valor de $0{,}03$ significa:", ["$P(H_0\\text{ verdadeira})=0{,}03$", "Sob $H_0$, a chance de um resultado tão ou mais extremo é $0{,}03$", "A chance de errar ao rejeitar é $0{,}97$", "O efeito é pequeno"], 1, "O p-valor é calculado supondo $H_0$; não é a probabilidade de $H_0$."], [21, "Não rejeitar $H_0$ significa:", ["$H_0$ foi provada verdadeira", "Os dados não trouxeram evidência suficiente contra $H_0$", "$H_1$ é falsa", "O teste errou"], 1, "\"Absolvido por falta de provas\", não \"provado inocente\"."], [21, "Mantidos $n$, $\\sigma$ e a alternativa, aumentar $\\alpha$:", ["Diminui o poder", "Aumenta o poder", "Não altera o poder", "Zera o erro tipo II"], 1, "Região de rejeição maior $\\Rightarrow$ mais chance de rejeitar quando $H_1$ é verdadeira (e também mais erro tipo I)."], [21, "No teste de uma proporção, o erro padrão da estatística usa:", ["$\\hat p$", "$p_0$", "$0{,}5$", "$1-\\hat p$"], 1, "A conta é feita supondo $H_0$ verdadeira, então usa-se $p_0$."], [21, "Após ver $\\bar x$ acima de $\\mu_0$, um aluno troca $H_1:\\mu\\ne\\mu_0$ por $H_1:\\mu>\\mu_0$. O problema é:", ["Nenhum", "O nível real do procedimento passa a ser $2\\alpha$", "O teste fica mais conservador", "O p-valor fica maior"], 1, "Escolher o lado depois de ver os dados dobra a chance de erro tipo I."], [21, "Erro tipo II é:", ["Rejeitar $H_0$ verdadeira", "Não rejeitar $H_0$ falsa", "Rejeitar $H_0$ falsa", "Usar o teste errado"], 1, "Tem probabilidade $\\beta$; poder $=1-\\beta$."], [22, "Mediu-se a temperatura dos mesmos 8 motores antes e depois de uma troca de óleo. O método adequado é:", ["Welch", "Teste t pareado", "Duas proporções", "Teste z com $\\sigma$ conhecido"], 1, "Mesmas unidades medidas duas vezes: analise as diferenças."], [22, "Tratar dados pareados como dois grupos independentes tende a:", ["Aumentar o poder", "Inflar o erro padrão e esconder o efeito", "Não mudar nada", "Diminuir o erro padrão"], 1, "A variação entre unidades entra no EP; ao parear, ela se cancela nas diferenças."], [22, "Os graus de liberdade de Welch devem ser arredondados:", ["Para cima", "Para baixo", "Para o inteiro mais próximo", "Não se arredonda"], 1, "Para baixo é conservador: dá um crítico maior."], [22, "No teste de duas proporções, o erro padrão usa:", ["As duas proporções separadas", "A proporção combinada $\\hat p_c$", "Sempre $0{,}5$", "Apenas a maior proporção"], 1, "Sob $H_0: p_1=p_2$, estima-se o valor comum pela proporção combinada."], [22, "O teste de duas proporções rejeita $H_0$ a 5%. O IC de 95% para $p_1-p_2$:", ["Necessariamente exclui o zero", "Pode, perto da fronteira, conter o zero", "Sempre contém o zero", "Não tem relação com o teste"], 1, "Teste (EP combinado) e IC (EPs separados) usam erros padrão diferentes; podem discordar na fronteira."], [22, "O teste de Welch:", ["Supõe variâncias iguais", "Não supõe variâncias iguais", "Só vale para dados pareados", "Usa proporções"], 1, "Cada grupo entra com sua própria variância."], [23, "Num passeio simétrico com 10 passos partindo de 0, $P(S_{10}=3)$ é:", ["$0{,}5$", "Zero", "$1/10$", "$252/1024$"], 1, "$S_{10}=2B-10$ é par: posição ímpar é impossível."], [23, "Duas fontes Poisson independentes com taxas 2/h e 3/h. O total é:", ["Poisson de taxa 5/h", "Poisson de taxa 6/h", "Binomial", "Exponencial de taxa 5"], 0, "Superposição: as taxas somam."], [23, "Num processo de Poisson, o número de ocorrências em $[2;\\,5]$ e em $[10;\\,13]$:", ["Têm a mesma distribuição", "Têm distribuições diferentes", "São sempre iguais", "São dependentes"], 0, "Incrementos estacionários: só o comprimento (3) importa; e são independentes por serem disjuntos."], [23, "Numa matriz de transição de Markov:", ["Cada coluna soma 1", "Cada linha soma 1", "A diagonal soma 1", "A matriz inteira soma 1"], 1, "A linha $i$ lista para onde se vai saindo de $i$; essas probabilidades somam 1."], [23, "A hipótese de Markov diz que:", ["O futuro depende de todo o passado", "O próximo estado depende só do estado atual", "Os estados são equiprováveis", "A cadeia sempre volta ao início"], 1, "Falta de memória em tempo discreto: há quanto tempo está no estado não importa."], [23, "Cada ocorrência de um Poisson(6/h) é crítica com prob. $0{,}25$. As críticas formam:", ["Poisson de taxa 6/h", "Poisson de taxa 1,5/h", "$\\text{Bin}(6;\\,0{,}25)$", "$\\text{Exp}(0{,}25)$"], 1, "Afinamento: taxa $q\\lambda=0{,}25\\times6=1{,}5$."], [23, "A distribuição estacionária $\\pi$ de uma cadeia satisfaz:", ["$\\pi=P$", "$\\pi=\\pi P$ e $\\sum\\pi_i=1$", "$\\pi P=0$", "$\\pi=P\\pi$ com $\\sum\\pi_i=0$"], 1, "Ela não muda após um passo; interpreta-se como a fração de tempo em cada estado no longo prazo."]];
const SLIDES=[{"a": 13, "tipo": "Exemplo", "titulo": "Erro de arredondamento", "q": "Um instrumento registra a leitura arredondada ao passo de uma unidade de escala. O erro cometido é igualmente provável em qualquer ponto de $[-0{,}5;\\;0{,}5]$. Qual a probabilidade de o erro ter módulo até $0{,}2$?", "r": "$X\\sim\\text{Uniforme}(-0{,}5;\\;0{,}5)$, então $f(x)=\\dfrac{1}{b-a}=1$.<br>\n$P(|X|\\le0{,}2)=P(-0{,}2\\le X\\le0{,}2)=\\dfrac{0{,}4}{1}=\\mathbf{0{,}4}$<br>\nBônus: $E(X)=0$ e $\\operatorname{Var}(X)=\\dfrac{(b-a)^2}{12}=\\dfrac1{12}\\approx0{,}083$."}, {"a": 13, "tipo": "Exemplo", "titulo": "Falha dentro da garantia", "q": "A vida até a falha de um componente é exponencial com média de 800 horas. A garantia cobre 300 horas. Que fração falha dentro da garantia?", "r": "Média 800 $\\Rightarrow\\lambda=\\dfrac1{800}$.<br>\n$P(X<300)=1-e^{-300/800}=1-e^{-0{,}375}\\approx\\mathbf{0{,}313}$<br>\nCerca de 31% falham na garantia. Vida mediana: $800\\ln2\\approx554$ h."}, {"a": 13, "tipo": "Exemplo", "titulo": "Espera pela terceira ocorrência", "q": "Ocorrências acontecem de forma independente, a uma taxa média de 2 por hora. Qual a probabilidade de a terceira ocorrência demorar mais de 2 horas?", "r": "O tempo até a 3ª ocorrência é soma de 3 exponenciais de taxa 2: $X\\sim\\text{Gama}(3;\\,2)$, com $E(X)=\\dfrac32=1{,}5$ h e $\\operatorname{Var}(X)=\\dfrac34=0{,}75$ h².<br>\nForma inteira: $P(X>t)=e^{-\\lambda t}\\displaystyle\\sum_{k=0}^{\\alpha-1}\\frac{(\\lambda t)^k}{k!}$.<br>\nCom $\\lambda t=4$: $P(X>2)=e^{-4}\\left(1+4+\\dfrac{4^2}{2}\\right)=13e^{-4}\\approx\\mathbf{0{,}238}$<br>\nÉ o mesmo que pedir no máximo 2 ocorrências em 2 h num $\\text{Poisson}(4)$."}, {"a": 13, "tipo": "Exemplo", "titulo": "Garantia com envelhecimento", "q": "A vida de um componente é Weibull com escala de 1000 horas e forma 2. A garantia cobre 300 horas. Que fração falha dentro da garantia?", "r": "$F(x)=1-e^{-(x/\\eta)^\\beta}$, com $\\eta=1000$ e $\\beta=2$.<br>\n$P(X<300)=1-e^{-(0{,}3)^2}=1-e^{-0{,}09}\\approx\\mathbf{0{,}086}$<br>\nA exponencial de mesma escala daria $1-e^{-0{,}3}\\approx0{,}259$. Com $\\beta=2$ o risco começa baixo e cresce: a falha precoce é três vezes mais rara. Trocar Weibull por exponencial superestima a falha na garantia e subestima a falha na velhice."}, {"a": 13, "tipo": "Exercício 1", "titulo": "Uniforme em [4; 10]", "q": "Uma grandeza é uniforme no intervalo $[4;\\,10]$.<br>(a) Escreva $f$ e $F$. (b) Calcule $P(5<X<8)$. (c) Calcule $E(X)$ e $\\operatorname{Var}(X)$. (d) Obtenha a mediana e o quantil $0{,}9$.", "r": "(a) $f(x)=\\dfrac16$ em $[4;10]$ e $F(x)=\\dfrac{x-4}{6}$ nesse intervalo (0 antes, 1 depois).<br>\n(b) $F(8)-F(5)=\\dfrac46-\\dfrac16=\\mathbf{0{,}5}$<br>\n(c) $E(X)=\\dfrac{4+10}{2}=\\mathbf{7}$; $\\;\\operatorname{Var}(X)=\\dfrac{6^2}{12}=\\dfrac{36}{12}=\\mathbf{3}$<br>\n(d) Mediana $=7$ (centro). Quantil $0{,}9$: $4+0{,}9\\times6=\\mathbf{9{,}4}$"}, {"a": 13, "tipo": "Exercício 2", "titulo": "Exponencial com média de 500 h", "q": "O tempo até a falha de um componente é exponencial com média de 500 horas.<br>(a) Calcule $P(X>400)$. (b) O componente já operou 600 h: qual a probabilidade de operar mais 400 h? (c) Obtenha a vida mediana.", "r": "(a) $P(X>400)=e^{-400/500}=e^{-0{,}8}\\approx\\mathbf{0{,}449}$<br>\n(b) Pela falta de memória, o mesmo: $\\mathbf{0{,}449}$<br>\n(c) $F(m)=0{,}5\\Rightarrow m=500\\ln2\\approx\\mathbf{347}$ h<br>\n<i>Cai em prova:<\/i> a resposta errada esperada em (b) é \"menos que 0,449, porque a peça já está gasta\". Isso só valeria se o componente envelhecesse, que é o que a Weibull com $\\beta>1$ captura."}, {"a": 13, "tipo": "Exercício 3", "titulo": "Escolha de modelos", "q": "Diga se cada escolha de modelo é adequada e justifique.<br>1. Exponencial para a vida de um componente cuja taxa de falha cresce com o uso.<br>2. Uniforme para o erro de arredondamento de um instrumento de passo fixo.<br>3. Gama de forma 1 para o tempo até a terceira ocorrência de um processo de Poisson.<br>4. Weibull de forma 1 para um item que não envelhece.", "r": "1. <b>Inadequada.<\/b> Taxa constante é a marca da exponencial. Use Weibull com $\\beta>1$.<br>\n2. <b>Adequada.<\/b> Nenhum ponto do passo é preferido.<br>\n3. <b>Inadequada.<\/b> Forma 1 é a própria exponencial (espera pela 1ª ocorrência). O correto é forma 3.<br>\n4. <b>Adequada.<\/b> Com $\\beta=1$ a Weibull é a exponencial.<br>\nOs itens 3 e 4 são o mesmo fato lido nos dois sentidos."}, {"a": 14, "tipo": "Exemplo", "titulo": "Leitura dentro de uma faixa", "q": "Uma grandeza medida por um instrumento é normal, com média 10 e desvio padrão $0{,}2$. Qual a probabilidade de a leitura cair entre $9{,}6$ e $10{,}3$?", "r": "Padronizando: $z_1=\\dfrac{9{,}6-10}{0{,}2}=-2$ e $z_2=\\dfrac{10{,}3-10}{0{,}2}=1{,}5$.<br>\n$P(9{,}6\\le X\\le10{,}3)=\\Phi(1{,}5)-\\Phi(-2)=0{,}9332-0{,}0228\\approx\\mathbf{0{,}910}$"}, {"a": 14, "tipo": "Exemplo", "titulo": "Faixa central de 95%", "q": "Se $X\\sim N(12;\\;1{,}5^2)$, qual é a faixa central que contém 95% dos valores? E o valor que separa os 95% menores?", "r": "Faixa central: $12\\pm1{,}96\\times1{,}5=\\mathbf{[9{,}06;\\;14{,}94]}$ (deixa 2,5% de cada lado).<br>\nOs 95% menores deixam 5% de um lado só: $12+1{,}645\\times1{,}5\\approx\\mathbf{14{,}47}$.<br>\nFaixa central de 95% $\\ne$ \"os 95% menores\"."}, {"a": 14, "tipo": "Exemplo", "titulo": "Um total feito de três parcelas", "q": "Um total é a soma de três contribuições independentes, cada uma com média 40 e desvio padrão $0{,}3$. Qual a probabilidade de o total passar de $120{,}8$?", "r": "$S\\sim N(120;\\;3\\times0{,}09)=N(120;\\;0{,}27)$, $\\;DP=\\sqrt{0{,}27}\\approx0{,}520$.<br>\n$P(S>120{,}8)=1-\\Phi\\!\\left(\\dfrac{0{,}8}{0{,}520}\\right)=1-\\Phi(1{,}54)\\approx\\mathbf{0{,}062}$<br>\nQuem soma desvios padrão usa $0{,}9$, chega a $\\Phi(0{,}889)$ e responde $0{,}187$: o erro triplica a probabilidade."}, {"a": 14, "tipo": "Exercício 1", "titulo": "Especificação entre 9 e 14", "q": "Uma característica de qualidade é normal com média 12 e desvio padrão $1{,}5$. A especificação aceita valores entre 9 e 14.<br>(a) Que fração fica fora da especificação? (b) Calcule $P(10{,}5\\le X\\le14)$. (c) Ache o valor ultrapassado por apenas 5%.", "r": "(a) $z=\\dfrac{9-12}{1{,}5}=-2$ e $z=\\dfrac{14-12}{1{,}5}=1{,}333$: $\\;P(X<9)+P(X>14)=0{,}0228+0{,}0912\\approx\\mathbf{0{,}114}$<br>\n(b) $\\Phi(1{,}333)-\\Phi(-1)=0{,}9088-0{,}1587\\approx\\mathbf{0{,}750}$<br>\n(c) $12+1{,}645\\times1{,}5\\approx\\mathbf{14{,}47}$"}, {"a": 14, "tipo": "Exercício 2", "titulo": "Soma e diferença de normais", "q": "Duas contribuições independentes têm $X\\sim N(50;\\;2^2)$ e $Y\\sim N(30;\\;1{,}5^2)$.<br>(a) Qual a distribuição de $X+Y$? (b) Calcule $P(X+Y>84)$. (c) Qual a distribuição de $X-Y$?", "r": "(a) $X+Y\\sim N(80;\\;4+2{,}25)=\\mathbf{N(80;\\;6{,}25)}$, $\\;DP=2{,}5$.<br>\n(b) $1-\\Phi\\!\\left(\\dfrac{4}{2{,}5}\\right)=1-\\Phi(1{,}6)\\approx\\mathbf{0{,}055}$<br>\n(c) $X-Y\\sim\\mathbf{N(20;\\;6{,}25)}$: a média subtrai, a variância soma do mesmo jeito.<br>\n<i>Cai em prova:<\/i> o erro esperado é variância $4-2{,}25=1{,}75$. Subtrair $Y$ acrescenta incerteza tanto quanto somar."}, {"a": 14, "tipo": "Exercício 3", "titulo": "Lognormal com μ = 2 e σ = 0,5", "q": "Uma grandeza positiva é lognormal com $\\mu=2$ e $\\sigma=0{,}5$ na escala do logaritmo, medida em horas.<br>(a) Ache a mediana. (b) Ache a média. (c) Calcule $P(X>10)$.", "r": "(a) Mediana $=e^{\\mu}=e^2\\approx\\mathbf{7{,}39}$ h<br>\n(b) $E(X)=e^{\\mu+\\sigma^2/2}=e^{2{,}125}\\approx\\mathbf{8{,}37}$ h, cerca de 13% acima da mediana.<br>\n(c) $\\ln10\\approx2{,}303$: $\\;P(X>10)=1-\\Phi\\!\\left(\\dfrac{2{,}303-2}{0{,}5}\\right)=1-\\Phi(0{,}605)\\approx\\mathbf{0{,}273}$"}, {"a": 15, "tipo": "Exemplo", "titulo": "Duas contagens no mesmo turno", "q": "Um turno registra duas contagens $X$ e $Y$, ambas em $\\{0;\\,1;\\,2\\}$, com a conjunta:<table class='mini'><tr><th>x\\y<\/th><th>0<\/th><th>1<\/th><th>2<\/th><\/tr><tr><th>0<\/th><td>0,20<\/td><td>0,10<\/td><td>0,05<\/td><\/tr><tr><th>1<\/th><td>0,15<\/td><td>0,20<\/td><td>0,10<\/td><\/tr><tr><th>2<\/th><td>0,05<\/td><td>0,05<\/td><td>0,10<\/td><\/tr><\/table>Qual a probabilidade de as duas coincidirem?", "r": "O evento $\\{X=Y\\}$ reúne as três células da diagonal: $P(X=Y)=0{,}20+0{,}20+0{,}10=\\mathbf{0{,}50}$.<br>\nA massa se concentra na diagonal: as contagens tendem a andar juntas."}, {"a": 15, "tipo": "Exemplo", "titulo": "Três desfechos possíveis (Multinomial)", "q": "Doze itens são processados de forma independente. Cada um termina numa de três categorias, com probabilidades $0{,}80$, $0{,}15$ e $0{,}05$.<br>(a) Qual a probabilidade de sair exatamente 9, 2 e 1? (b) E de nenhum item cair na terceira categoria?", "r": "(a) Coeficiente: $\\dfrac{12!}{9!\\,2!\\,1!}=660$. $\\;P=660\\times0{,}80^9\\times0{,}15^2\\times0{,}05\\approx\\mathbf{0{,}0997}$<br>\n(b) Uma componente sozinha é $\\text{Bin}(12;\\;0{,}05)$: $P(X_3=0)=0{,}95^{12}\\approx\\mathbf{0{,}540}$<br>\nAs componentes são Binomiais, mas nunca independentes entre si: somam $n$."}, {"a": 15, "tipo": "Exemplo", "titulo": "Um ponto sorteado num retângulo", "q": "Um ponto é sorteado ao acaso na região $0<x<2$, $0<y<3$, com densidade constante $f(x,y)=\\dfrac16$. Qual a probabilidade de a primeira coordenada passar de 1 enquanto a segunda fica abaixo de 1?", "r": "A região é o retângulo $1<x<2$, $0<y<1$, de área 1. Com densidade constante, probabilidade = área $\\times$ altura $=1\\times\\dfrac16\\approx\\mathbf{0{,}167}$.<br>\nIsso só funciona porque a densidade é constante; fora desse caso, integre."}, {"a": 15, "tipo": "Exercício 1", "titulo": "Marginais e acumulada conjunta", "q": "$X$ vale 0 ou 1; $Y$ vale 0, 1 ou 2. A conjunta é:<table class='mini'><tr><th>x\\y<\/th><th>0<\/th><th>1<\/th><th>2<\/th><\/tr><tr><th>0<\/th><td>0,10<\/td><td>0,15<\/td><td>0,05<\/td><\/tr><tr><th>1<\/th><td>0,20<\/td><td>0,30<\/td><td>0,20<\/td><\/tr><\/table>(a) As duas marginais. (b) $P(X=1,\\,Y\\le1)$. (c) $F(0;1)$.", "r": "(a) Linhas: $p_X(0)=0{,}30$ e $p_X(1)=0{,}70$. Colunas: $p_Y=(0{,}30;\\;0{,}45;\\;0{,}25)$.<br>\n(b) Duas células da segunda linha: $0{,}20+0{,}30=\\mathbf{0{,}50}$<br>\n(c) $F(0;1)=P(X\\le0,\\,Y\\le1)=0{,}10+0{,}15=\\mathbf{0{,}25}$"}, {"a": 15, "tipo": "Exercício 2", "titulo": "Densidade 4xy no quadrado", "q": "Um par $(X,Y)$ tem densidade conjunta $f(x,y)=4xy$ no quadrado $0<x<1$, $0<y<1$ (zero fora).<br>(a) Verifique que $f$ é densidade. (b) Ache as marginais. (c) Calcule $P(X<0{,}5,\\;Y>0{,}5)$. (d) Que valor de $k$ tornaria $f(x,y)=kxy^2$ densidade no mesmo quadrado?", "r": "(a) $\\displaystyle\\int_0^1\\!\\!\\int_0^1 4xy\\,dy\\,dx=4\\times\\frac12\\times\\frac12=1$ ✔<br>\n(b) $f_X(x)=\\displaystyle\\int_0^1 4xy\\,dy=\\mathbf{2x}$; do mesmo modo $f_Y(y)=\\mathbf{2y}$, ambas em $(0;\\,1)$.<br>\n(c) $\\displaystyle\\int_0^{0{,}5}\\!\\!\\int_{0{,}5}^{1}4xy\\,dy\\,dx=\\int_0^{0{,}5}4x(0{,}375)\\,dx=1{,}5\\times0{,}125=\\mathbf{0{,}1875}$<br>A área da região é $0{,}25$, mas a densidade cresce com $x$ e $y$, deixando esse canto mais leve.<br>\n(d) $\\displaystyle\\iint kxy^2=k\\times\\frac12\\times\\frac13=\\frac k6=1\\Rightarrow\\mathbf{k=6}$. A constante é sempre o inverso da integral da forma."}, {"a": 15, "tipo": "Exercício 3", "titulo": "Mesmas marginais, conjuntas diferentes", "q": "Um par $(X,Y)$ com valores em $\\{0;\\,1\\}$ tem a conjunta:<table class='mini'><tr><th>x\\y<\/th><th>0<\/th><th>1<\/th><\/tr><tr><th>0<\/th><td>0,40<\/td><td>0,10<\/td><\/tr><tr><th>1<\/th><td>0,10<\/td><td>0,40<\/td><\/tr><\/table>(a) As marginais e $P(X=Y)$. (b) Construa outra conjunta com as mesmas marginais. (c) Entre todas elas, quais são o menor e o maior valor possível de $P(X=Y)$?", "r": "(a) As duas marginais valem $0{,}50$ em cada ponto. $P(X=Y)=0{,}40+0{,}40=\\mathbf{0{,}80}$<br>\n(b) Trocar a diagonal pela antidiagonal: $0{,}10$ na diagonal e $0{,}40$ fora. As margens continuam meio a meio.<br>\n(c) Com $p(0;0)=p(1;1)=t$, as ma
