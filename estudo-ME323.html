rgens forçam $p(0;1)=p(1;0)=0{,}5-t$. Então $P(X=Y)=2t$, com $t\\in[0;\\,0{,}5]$: vai de <b>0 a 1<\/b>.<br>\nAs marginais não guardam nenhuma informação sobre associação."}, {"a": 16, "tipo": "Exemplo", "titulo": "As duas contagens são independentes?", "q": "Com a conjunta do exemplo da aula 15 (linhas $x=0{,}1{,}2$: $[0{,}20\\;\\;0{,}10\\;\\;0{,}05]$, $[0{,}15\\;\\;0{,}20\\;\\;0{,}10]$, $[0{,}05\\;\\;0{,}05\\;\\;0{,}10]$), $X$ e $Y$ são independentes?", "r": "Margens: $p_X=(0{,}35;\\;0{,}45;\\;0{,}20)$ e $p_Y=(0{,}40;\\;0{,}35;\\;0{,}25)$.<br>\nPrimeira célula: $p(0;0)=0{,}20$, contra $p_X(0)\\,p_Y(0)=0{,}35\\times0{,}40=0{,}14$.<br>\nComo $0{,}20\\ne0{,}14$, <b>não são independentes<\/b>. Basta uma célula para negar."}, {"a": 16, "tipo": "Exemplo", "titulo": "A densidade 4xy separa", "q": "A densidade $f(x,y)=4xy$ no quadrado unitário: $X$ e $Y$ são independentes?", "r": "O suporte é um retângulo e a expressão separa: $4xy=(2x)(2y)$. Logo $\\mathbf{X\\perp Y}$, com $f_X(x)=2x$ e $f_Y(y)=2y$ em $(0;\\,1)$. O critério de fatoração devolve as marginais em uma linha."}, {"a": 16, "tipo": "Exemplo", "titulo": "O aviso muda a probabilidade", "q": "Um sistema emite ou não um aviso. $X=1$ quando a condição de interesse ocorreu; $Y=1$ quando houve aviso. A conjunta é:<table class='mini'><tr><th>x\\y<\/th><th>0<\/th><th>1<\/th><\/tr><tr><th>0<\/th><td>0,40<\/td><td>0,20<\/td><\/tr><tr><th>1<\/th><td>0,10<\/td><td>0,30<\/td><\/tr><\/table>Qual a probabilidade de a condição ter ocorrido, dado que houve aviso?", "r": "$p_Y(1)=0{,}20+0{,}30=0{,}50$. Dividindo a coluna $Y=1$ por ela:<br>\n$p_{X\\mid Y}(1\\mid1)=\\dfrac{0{,}30}{0{,}50}=\\mathbf{0{,}60}$ $\\;$(e $p_{X\\mid Y}(0\\mid1)=0{,}40$)<br>\nSem o aviso, a condição tinha probabilidade $p_X(1)=0{,}40$. Com ele, passa a $0{,}60$."}, {"a": 16, "tipo": "Exemplo", "titulo": "O triângulo: condicional uniforme", "q": "A densidade vale $f(x,y)=2$ em $0<y<x<1$, com marginal $f_X(x)=2x$. Ache $f_{Y\\mid X}$ e calcule $P(Y<0{,}2\\mid X=0{,}5)$.", "r": "$f_{Y\\mid X}(y\\mid x)=\\dfrac{2}{2x}=\\dfrac1x$, para $0<y<x$. Logo $\\mathbf{Y\\mid X=x\\sim\\text{Uniforme}(0,x)}$. O suporte da condicional depende de $x$: essa é a dependência.<br>\n$P(Y<0{,}2\\mid X=0{,}5)=\\dfrac{0{,}2}{0{,}5}=\\mathbf{0{,}40}$<br>\nComo o suporte (triângulo) não é retângulo, $X$ e $Y$ não podem ser independentes."}, {"a": 16, "tipo": "Exercício 1", "titulo": "Independência numa tabela 2×3", "q": "$X$ vale 0 ou 1; $Y$ vale 0, 1 ou 2. A conjunta é:<table class='mini'><tr><th>x\\y<\/th><th>0<\/th><th>1<\/th><th>2<\/th><\/tr><tr><th>0<\/th><td>0,15<\/td><td>0,15<\/td><td>0,10<\/td><\/tr><tr><th>1<\/th><td>0,15<\/td><td>0,30<\/td><td>0,15<\/td><\/tr><\/table>(a) As duas marginais. (b) $X$ e $Y$ são independentes? (c) A condicional de $Y$ dado $X=1$, comparada à marginal de $Y$.", "r": "(a) $p_X(0)=0{,}40$ e $p_X(1)=0{,}60$; $\\;p_Y=(0{,}30;\\;0{,}45;\\;0{,}25)$.<br>\n(b) A primeira célula já nega: $p(0;0)=0{,}15$ contra $0{,}40\\times0{,}30=0{,}12$. <b>Não são independentes.<\/b><br>\n(c) Dividindo a segunda linha por $0{,}60$: $p_{Y\\mid X}(\\cdot\\mid1)=\\mathbf{(0{,}25;\\;0{,}50;\\;0{,}25)}$, diferente da marginal $(0{,}30;\\;0{,}45;\\;0{,}25)$: confirma (b) por outro caminho."}, {"a": 16, "tipo": "Exercício 2", "titulo": "Duas exponenciais independentes", "q": "Dois componentes falham de modo independente. Os tempos até a falha, em horas, são $X\\sim\\text{Exp}(0{,}1)$ e $Y\\sim\\text{Exp}(0{,}2)$.<br>(a) Escreva a densidade conjunta. (b) Calcule $P(X>5,\\;Y>5)$. (c) Identifique a distribuição do menor dos dois tempos.", "r": "(a) A independência autoriza multiplicar: $f(x,y)=0{,}1\\,e^{-0{,}1x}\\times0{,}2\\,e^{-0{,}2y}$, $\\;x>0,\\;y>0$.<br>\n(b) $P(X>5)\\,P(Y>5)=e^{-0{,}5}\\times e^{-1}=e^{-1{,}5}\\approx\\mathbf{0{,}223}$<br>\n(c) O mínimo passa de $t$ quando os dois passam: $P(\\min>t)=e^{-0{,}3t}$, ou seja $\\mathbf{\\min\\sim\\text{Exp}(0{,}3)}$. Em série, as taxas se somam."}, {"a": 16, "tipo": "Exercício 3", "titulo": "Densidade x + y no quadrado", "q": "Um par $(X,Y)$ tem densidade $f(x,y)=x+y$ em $0<x<1$, $0<y<1$, zero fora.<br>(a) Verifique que é densidade e ache as marginais. (b) $X$ e $Y$ são independentes? (c) Ache $f_{Y\\mid X}(y\\mid x)$ e calcule $P(Y<0{,}5\\mid X=0{,}5)$.", "r": "(a) $\\displaystyle\\int_0^1\\!\\!\\int_0^1(x+y)\\,dy\\,dx=\\int_0^1\\left(x+\\frac12\\right)dx=1$ ✔. Marginais: $f_X(x)=x+\\dfrac12$ e $f_Y(y)=y+\\dfrac12$.<br>\n(b) <b>Não.<\/b> O suporte é retangular, então ele não decide: a resposta está na expressão. Em $x=y=0{,}1$ o produto das marginais dá $0{,}36$ e a conjunta dá $0{,}20$. A soma $x+y$ não se separa em $g(x)\\,h(y)$.<br>\n(c) $f_{Y\\mid X}(y\\mid x)=\\dfrac{x+y}{x+\\frac12}$, $\\;0<y<1$. Com $x=0{,}5$ o divisor vale 1:<br>$P(Y<0{,}5\\mid X=0{,}5)=\\displaystyle\\int_0^{0{,}5}(0{,}5+y)\\,dy=0{,}25+0{,}125=\\mathbf{0{,}375}$"}, {"a": 17, "tipo": "Exemplo", "titulo": "E(Y | X = x) numa tabela", "q": "Com a conjunta das aulas 15 e 16 (linhas $x=0{,}1{,}2$: $[0{,}20\\;\\;0{,}10\\;\\;0{,}05]$, $[0{,}15\\;\\;0{,}20\\;\\;0{,}10]$, $[0{,}05\\;\\;0{,}05\\;\\;0{,}10]$; $\\;p_X=(0{,}35;\\;0{,}45;\\;0{,}20)$), quanto vale $Y$ em média para cada valor observado de $X$?", "r": "Dividindo a linha $x=0$ por $0{,}35$: $\\left(\\frac47;\\frac27;\\frac17\\right)$, logo<br>\n$\\psi(0)=E(Y\\mid X=0)=0\\cdot\\dfrac47+1\\cdot\\dfrac27+2\\cdot\\dfrac17=\\dfrac47\\approx\\mathbf{0{,}571}$<br>\nPelo mesmo caminho, $\\psi(1)=\\dfrac89\\approx\\mathbf{0{,}889}$ e $\\psi(2)=\\mathbf{1{,}25}$.<br>\n$E(Y\\mid X=x)$ é número; $E(Y\\mid X)=\\psi(X)$ é variável aleatória."}, {"a": 17, "tipo": "Exemplo", "titulo": "Empilhamento de tolerâncias", "q": "Nove peças iguais são montadas em série. Cada uma tem dimensão média de 20 mm e desvio padrão de $0{,}02$ mm, com variação independente entre peças. Qual é o desvio padrão do comprimento total?", "r": "Com independência, as variâncias somam: $\\operatorname{Var}(S)=9\\times0{,}02^2=0{,}0036$ mm², então $\\mathbf{DP(S)=0{,}06}$ mm. A média do total é 180 mm.<br>\nSomar os desvios daria $0{,}18$ mm, três vezes o correto."}, {"a": 17, "tipo": "Exercício 1", "titulo": "Esperança iterada por turnos", "q": "Uma linha produz peças em dois turnos. O turno da manhã responde por 60% da produção, com 2 defeitos por lote em média; o turno da noite responde pelos outros 40%, com 5 defeitos por lote em média (o enunciado também informa a variância de cada turno). Sorteia-se um lote ao acaso. Qual é o número esperado de defeitos no lote sorteado?", "r": "O turno é a partição: $E(X)=E[E(X\\mid T)]=0{,}6\\times2+0{,}4\\times5=1{,}2+2=\\mathbf{3{,}2}$<br>\nAs variâncias de cada turno não entram: a esperança iterada só precisa das médias condicionais e dos pesos."}, {"a": 17, "tipo": "Exercício 2", "titulo": "Cov, ρ e variâncias de soma e diferença", "q": "Duas grandezas têm $E(X)=10$, $E(Y)=40$, $\\operatorname{Var}(X)=25$, $\\operatorname{Var}(Y)=100$ e $E(XY)=415$.<br>a. Calcule $\\operatorname{Cov}(X,Y)$ e $\\rho$. b. Calcule $\\operatorname{Var}(X+Y)$ e $\\operatorname{Var}(X-Y)$. c. O valor de $\\rho$ permite concluir que $X$ causa $Y$?", "r": "(a) $\\operatorname{Cov}=415-10\\times40=\\mathbf{15}$; $\\;\\rho=\\dfrac{15}{5\\times10}=\\mathbf{0{,}30}$<br>\n(b) $\\operatorname{Var}(X+Y)=25+100+30=\\mathbf{155}$; $\\;\\operatorname{Var}(X-Y)=25+100-30=\\mathbf{95}$<br>\n(c) <b>Não.<\/b> A associação é positiva e moderada, sem informação sobre direção nem sobre uma possível causa comum."}, {"a": 17, "tipo": "Exercício 3", "titulo": "Sensor com ruído", "q": "Um sensor mede $X\\sim N(100;\\;16)$ e devolve $Y=X+\\varepsilon$, com $\\varepsilon\\sim N(0;\\;9)$ independente de $X$.<br>a. Obtenha a distribuição de $Y$. b. Calcule $\\operatorname{Cov}(X,Y)$ e $\\rho$. c. Interprete $\\rho$ em termos da qualidade do sensor.", "r": "(a) Soma de normais independentes: $\\mathbf{Y\\sim N(100;\\;25)}$<br>\n(b) $\\operatorname{Cov}(X,Y)=\\operatorname{Cov}(X,X)+\\operatorname{Cov}(X,\\varepsilon)=\\operatorname{Var}(X)+0=\\mathbf{16}$; $\\;\\rho=\\dfrac{16}{4\\times5}=\\mathbf{0{,}80}$<br>\n(c) Bom, mas não perfeito: se $\\varepsilon$ fosse desprezível, $\\rho$ tenderia a 1. O ruído (variância 9) contra o sinal (16) puxa $\\rho$ para $0{,}80$. $\\rho$ depende da razão entre as variâncias: o mesmo sensor numa grandeza mais estável daria correlação menor."}, {"a": 18, "tipo": "Exemplo", "titulo": "A cota em dois tamanhos", "q": "Um instrumento sem erro sistemático mede com desvio padrão de 6 unidades. O valor reportado é a média de $n$ medidas. Limite a chance de a média errar por 1 unidade ou mais, com $n=100$ e com $n=400$.", "r": "Tchebyshev para a média: $P(|\\bar X-\\mu|\\ge\\varepsilon)\\le\\dfrac{\\sigma^2}{n\\varepsilon^2}=\\dfrac{36}{n}$.<br>\n$n=100$: cota $\\mathbf{0{,}36}$. $\\;n=400$: cota $\\mathbf{0{,}09}$.<br>\nQuadruplicar $n$ dividiu a cota por quatro (depende de $n$, não de $\\sqrt n$); o DP da média é que caiu pela metade. A cota vale para qualquer distribuição, por isso fica muito acima do valor real."}, {"a": 18, "tipo": "Exemplo", "titulo": "Contagem num lote", "q": "Cada uma de 400 unidades exige retrabalho com probabilidade $0{,}10$, de forma independente. Calcule a chance de o lote exigir retrabalho em 46 unidades ou menos.", "r": "$np=40$ e $n(1-p)=360$: a aproximação vale. Média 40, $DP=\\sqrt{36}=6$.<br>\nSem correção: $\\Phi\\!\\left(\\dfrac{46-40}{6}\\right)=\\Phi(1)=0{,}841$. O valor exato é $\\mathbf{0{,}860}$.<br>\nCom correção de continuidade: $\\Phi\\!\\left(\\dfrac{46{,}5-40}{6}\\right)=\\Phi(1{,}08)\\approx\\mathbf{0{,}860}$: a correção conserta o erro na segunda casa."}, {"a": 18, "tipo": "Exercício 1", "titulo": "Tamanho de amostra por Tchebyshev", "q": "Uma linha produz itens conformes com probabilidade $p$, desconhecida. Seja $X$ o número de conformes em $n$ itens. Determine $n$ que garanta $P\\left(\\left|\\dfrac Xn-p\\right|\\ge0{,}02\\right)\\le0{,}05$, sem supor distribuição nenhuma nem conhecer $p$.", "r": "$X/n$ é a média de $n$ Bernoulli$(p)$. Pior caso da variância: $p(1-p)\\le\\dfrac14$.<br>\n$P\\left(\\left|\\dfrac Xn-p\\right|\\ge0{,}02\\right)\\le\\dfrac{1/4}{n\\times0{,}02^2}=\\dfrac{625}{n}$<br>\n$\\dfrac{625}{n}\\le0{,}05\\Rightarrow\\mathbf{n\\ge12\\,500}$<br>\nPelo TCL, com $p=0{,}5$, a chance real nesse $n$ seria menor que $0{,}00001$: a folga é o preço de não supor modelo."}, {"a": 18, "tipo": "Exercício 2", "titulo": "Tchebyshev × TCL", "q": "Cem tarefas independentes, de mesma distribuição, são executadas em sequência. Cada uma leva, em média, 5 unidades de tempo, com desvio padrão de 2. Limite a chance de o total passar de 530 por Tchebyshev, depois estime pelo TCL.", "r": "$E(S)=500$, $\\;\\operatorname{Var}(S)=100\\times4=400$, $\\;DP=20$. O desvio pedido (30) são $1{,}5$ DP.<br>\nTchebyshev: $P(|S-500|\\ge30)\\le\\dfrac1{1{,}5^2}=\\mathbf{0{,}444}$ (limita também o lado de cima sozinho).<br>\nTCL: $P(S>530)\\approx1-\\Phi(1{,}5)=\\mathbf{0{,}067}$<br>\nA garantia é quase sete vezes maior que a estimativa."}, {"a": 18, "tipo": "Exercício 3", "titulo": "Aproximação normal com correção", "q": "Cada um de 400 itens é não conforme com probabilidade $0{,}06$, de forma independente. Verifique se a aproximação normal vale e calcule a chance de o lote trazer 30 não conformes ou mais, com correção de continuidade.", "r": "$np=24$ e $n(1-p)=376$, ambos acima de 10: vale. Média 24, $DP=\\sqrt{400\\times0{,}06\\times0{,}94}\\approx4{,}750$.<br>\n$X\\ge30$ inclui a barra do 30 inteira, que começa em $29{,}5$:<br>\n$P(X\\ge30)\\approx1-\\Phi\\!\\left(\\dfrac{29{,}5-24}{4{,}750}\\right)=1-\\Phi(1{,}158)=\\mathbf{0{,}123}$<br>\nExato: $0{,}125$. Sem a correção: $0{,}103$."}, {"a": 19, "tipo": "Exemplo", "titulo": "Nomear os quatro", "q": "Dez mil unidades de um processo foram registradas. Cinquenta delas foram sorteadas e medidas. A média das cinquenta deu $48{,}2$. Nomeie a população, a amostra, o parâmetro e a estatística.", "r": "<b>População:<\/b> as dez mil unidades. <b>Amostra:<\/b> as cinquenta medidas.<br>\n<b>Parâmetro:<\/b> a média $\\mu$ das dez mil, que ninguém calculou. <b>Estatística:<\/b> $\\bar X$, com valor observado $48{,}2$.<br>\n$48{,}2$ não é $\\mu$: é uma estimativa, que mudaria com outras cinquenta unidades."}, {"a": 19, "tipo": "Exemplo", "titulo": "O preço de dobrar a precisão", "q": "Um instrumento mede com desvio padrão de 8 unidades. O valor reportado é a média de $n$ leituras. Determine o menor $n$ com erro padrão de no máximo 1 unidade, depois com erro padrão de no máximo $0{,}5$.", "r": "$\\dfrac{8}{\\sqrt n}\\le1\\Rightarrow\\sqrt n\\ge8\\Rightarrow\\mathbf{n\\ge64}$<br>\n$\\dfrac{8}{\\sqrt n}\\le0{,}5\\Rightarrow\\sqrt n\\ge16\\Rightarrow\\mathbf{n\\ge256}$<br>\nDobrar a precisão custou quatro vezes mais leituras."}, {"a": 19, "tipo": "Exercício 1", "titulo": "Média, s e erro padrão", "q": "Oito leituras de uma grandeza: 12,1 · 11,8 · 12,4 · 12,0 · 11,6 · 12,3 · 11,9 · 12,1. Calcule a média amostral, o desvio padrão amostral e o erro padrão estimado da média.", "r": "Soma $=96{,}2\\Rightarrow\\bar x=\\dfrac{96{,}2}{8}=\\mathbf{12{,}025}$<br>\n$\\sum(x_i-\\bar x)^2=0{,}475\\Rightarrow s^2=\\dfrac{0{,}475}{7}=0{,}0679\\Rightarrow\\mathbf{s=0{,}2605}$<br>\n$\\widehat{EP}(\\bar X)=\\dfrac{s}{\\sqrt n}=\\dfrac{0{,}2605}{\\sqrt8}=\\mathbf{0{,}0921}$"}, {"a": 19, "tipo": "Exercício 2", "titulo": "De 25 para 100 leituras", "q": "Um laboratório afirma que passar de 25 para 100 leituras divide por quatro o erro padrão da média. Avalie a afirmação.", "r": "$EP=\\dfrac{\\sigma}{\\sqrt n}$: a raiz vai de 5 para 10, então o EP cai <b>pela metade<\/b>, não por quatro. <b>A afirmação está errada.<\/b><br>\nQuadruplicar $n$ divide por quatro a <i>variância<\/i> da média; o laboratório aplicou ao EP o fator da variância."}, {"a": 19, "tipo": "Exercício 3", "titulo": "Quantil da t com 7 gl", "q": "Seja $T$ com distribuição t de Student com 7 graus de liberdade. Determine $c$ tal que $P(-c\\le T\\le c)=0{,}95$ e compare com o valor da normal padrão.", "r": "Por simetria, cada cauda recebe $0{,}025$, então $c$ é o quantil $0{,}975$: $\\mathbf{c=t_{7;\\,0{,}975}=2{,}3646}$, contra $\\mathbf{1{,}9600}$ da normal.<br>\nCerca de 21% maior: é o preço de estimar $\\sigma$ com oito observações."}, {"a": 20, "tipo": "Exemplo", "titulo": "A faixa de uma média (σ conhecido)", "q": "Uma grandeza foi medida 64 vezes, com média amostral $5{,}03$. O desvio padrão populacional é conhecido e vale $0{,}16$. Construa o IC de 95% para a média.", "r": "$EP=\\dfrac{0{,}16}{\\sqrt{64}}=0{,}02$. IC: $5{,}03\\pm1{,}960\\times0{,}02=5{,}03\\pm0{,}0392=\\mathbf{[4{,}9908;\\;5{,}0692]}$, de largura $0{,}0784$ (menos de 2% da estimativa)."}, {"a": 20, "tipo": "Exemplo", "titulo": "O intervalo sem conhecer σ", "q": "Doze repetições de um processo tiveram a duração medida, em segundos. A média amostral deu $42{,}6$ e o desvio padrão amostral $3{,}1$. Construa o IC de 95% para a duração média.", "r": "11 graus de liberdade: $t_{11;\\,0{,}975}=2{,}2010$. $\\;\\widehat{EP}=\\dfrac{3{,}1}{\\sqrt{12}}=0{,}8949$.<br>\nIC: $42{,}6\\pm2{,}2010\\times0{,}8949=42{,}6\\pm1{,}9696=\\mathbf{[40{,}63;\\;44{,}57]}$<br>\nUsar $1{,}960$ daria margem $1{,}7540$, cerca de 11% menor: estreitar com informação que a amostra não tem."}, {"a": 20, "tipo": "Exemplo", "titulo": "Proporção de não conformes", "q": "Foram inspecionadas 800 unidades e 28 foram reprovadas. Construa o IC de 95% para a proporção de reprovação.", "r": "$n\\hat p=28$ e $n(1-\\hat p)=772$: a regra prática vale. $\\hat p=0{,}035$.<br>\n$\\widehat{EP}=\\sqrt{\\dfrac{0{,}035\\times0{,}965}{800}}=0{,}006498$<br>\nIC: $0{,}035\\pm1{,}960\\times0{,}006498=\\mathbf{[0{,}0223;\\;0{,}0477]}$, de 2,2% a 4,8%."}, {"a": 20, "tipo": "Exemplo", "titulo": "Quantas medidas bastam", "q": "O desvio padrão populacional é 12. Determine o menor $n$ cuja margem de erro não passe de 2 unidades, com 95% e depois com 99% de confiança.", "r": "$n\\ge\\left(\\dfrac{z\\,\\sigma}{E}\\right)^2$<br>\n95%: $\\left(\\dfrac{1{,}960\\times12}{2}\\right)^2=138{,}30\\Rightarrow\\mathbf{n=139}$<br>\n99%: $\\left(\\dfrac{2{,}576\\times12}{2}\\right)^2=238{,}89\\Rightarrow\\mathbf{n=239}$<br>\nSempre arredonde para cima. Para proporção sem estimativa prévia, use o pior caso $p=0{,}5$."}, {"a": 20, "tipo": "Exercício 1", "titulo": "IC de 90% e de 99%", "q": "Dez medidas deram média amostral $36{,}4$. O desvio padrão populacional é conhecido e vale $2{,}5$. Supondo a população normal, construa os IC de 90% e de 99% e compare as larguras.", "r": "$EP=\\dfrac{2{,}5}{\\sqrt{10}}=0{,}7906$ (o mesmo nos dois níveis).<br>\n90%: $36{,}4\\pm1{,}645\\times0{,}7906=36{,}4\\pm1{,}3004=\\mathbf{[35{,}10;\\;37{,}70]}$<br>\n99%: $36{,}4\\pm2{,}576\\times0{,}7906=36{,}4\\pm2{,}0364=\\mathbf{[34{,}36;\\;38{,}44]}$<br>\nA largura cresce 57% (razão $2{,}576/1{,}645$). Pagou-se confiança com precisão."}, {"a": 20, "tipo": "Exercício 2", "titulo": "IC t com as oito leituras", "q": "As oito leituras do exercício 1 da aula 19 ($\\bar x=12{,}025$, $s=0{,}2605$, $\\widehat{EP}=0{,}0921$). Supondo a população normal, construa o IC de 95% para a média.", "r": "7 gl: $t_{7;\\,0{,}975}=2{,}3646$.<br>\nIC: $12{,}025\\pm2{,}3646\\times0{,}0921=12{,}025\\pm0{,}2178=\\mathbf{[11{,}807;\\;12{,}243]}$<br>\nLargura $0{,}4356$; com o crítico da normal seria $0{,}3610$. O acréscimo de 21% é o preço de estimar $\\sigma$."}, {"a": 20, "tipo": "Exercício 3", "titulo": "Interpretação do IC", "q": "Um IC de 95% para $\\mu$ resultou em $[48{,}1;\\;51{,}9]$. Classifique cada afirmação como correta ou incorreta.<br>1. A probabilidade de $\\mu$ cair entre $48{,}1$ e $51{,}9$ é $0{,}95$.<br>2. Em 95% das amostras deste tamanho, o intervalo assim construído contém $\\mu$.<br>3. Cerca de 95% das observações da população caem entre $48{,}1$ e $51{,}9$.<br>4. Uma nova amostra terá média dentro de $[48{,}1;\\;51{,}9]$ com chance $0{,}95$.", "r": "1. <b>Incorreta:<\/b> com os dados já observados, $\\mu$ está dentro ou fora.<br>\n2. <b>Correta:<\/b> fala do procedimento repetido.<br>\n3. <b>Incorreta:<\/b> confunde a dispersão da média com a das observações, que é $\\sqrt n$ vezes maior.<br>\n4. <b>Incorreta:<\/b> troca o parâmetro pela estatística de uma amostra futura.<br>\nSó a 2 está correta."}, {"a": 21, "tipo": "Exemplo", "titulo": "A média nominal se mantém? (z)", "q": "Um processo deve operar com média nominal 500. Trinta e seis medidas deram média $504{,}5$, com desvio padrão populacional conhecido igual a 12. Teste a 5%.", "r": "$H_0:\\mu=500$ contra $H_1:\\mu\\ne500$. $\\;EP=\\dfrac{12}{\\sqrt{36}}=2$.<br>\n$z_{obs}=\\dfrac{504{,}5-500}{2}=2{,}25>1{,}960\\Rightarrow$ <b>rejeita-se $H_0$ a 5%<\/b>.<br>\nA 1% o crítico é $2{,}576$ e a mesma amostra deixa de rejeitar: o veredito depende do risco aceito."}, {"a": 21, "tipo": "Exemplo", "titulo": "O mesmo teste sem conhecer σ (t)", "q": "Quinze repetições deram média $12{,}42$ e desvio padrão amostral $0{,}60$. O valor nominal é $12{,}00$. Teste a 5%, supondo a população normal.", "r": "14 gl: $t_{14;\\,0{,}975}=2{,}1448$. $\\;\\widehat{EP}=\\dfrac{0{,}60}{\\sqrt{15}}=0{,}1549$.<br>\n$t_{obs}=\\dfrac{12{,}42-12{,}00}{0{,}1549}=2{,}7111>2{,}1448\\Rightarrow$ <b>rejeita-se $H_0$ a 5%<\/b>. O processo opera acima do nominal."}, {"a": 21, "tipo": "Exemplo", "titulo": "A taxa declarada se sustenta?", "q": "Um fornecedor declara taxa de reprovação de 5%. Numa inspeção de 400 unidades, 28 foram reprovadas. Teste a declaração a 5%.", "r": "$np_0=20$ e $n(1-p_0)=380$: vale. $\\hat p=0{,}07$.<br>\n$EP_0=\\sqrt{\\dfrac{0{,}05\\times0{,}95}{400}}=0{,}010897$ (usa $p_0$!)<br>\n$z_{obs}=\\dfrac{0{,}07-0{,}05}{0{,}010897}=1{,}8353<1{,}960\\Rightarrow$ <b>não se rejeita $H_0$<\/b>. p-valor (bilateral) $=\\mathbf{0{,}0665}$."}, {"a": 21, "tipo": "Exercício 1", "titulo": "Teste t e IC: dualidade", "q": "Dezesseis repetições deram média $10{,}4$ e desvio padrão amostral $1{,}2$. O valor nominal é $10{,}0$. Teste a 5%, construa o IC de 95% e relacione os dois resultados.", "r": "15 gl: $t_{15;\\,0{,}975}=2{,}1314$. $\\;\\widehat{EP}=\\dfrac{1{,}2}{\\sqrt{16}}=0{,}3$.<br>\n$t_{obs}=\\dfrac{10{,}4-10{,}0}{0{,}3}=1{,}3333<2{,}1314\\Rightarrow$ <b>não se rejeita $H_0$<\/b>.<br>\nIC: $10{,}4\\pm2{,}1314\\times0{,}3=\\mathbf{[9{,}761;\\;11{,}039]}$, que contém $10{,}0$, como a dualidade exige."}, {"a": 21, "tipo": "Exercício 2", "titulo": "Teste de proporção a 5% e a 1%", "q": "Duzentas e cinquenta unidades foram inspecionadas e 32 reprovaram. O fornecedor declara taxa de reprovação de 8%. Teste a declaração a 5%, depois a 1%.", "r": "$np_0=20$ e $n(1-p_0)=230$: vale. $\\hat p=\\dfrac{32}{250}=0{,}128$.<br>\n$EP_0=\\sqrt{\\dfrac{0{,}08\\times0{,}92}{250}}=0{,}017158$<br>\n$z_{obs}=\\dfrac{0{,}128-0{,}08}{0{,}017158}=2{,}7975$. p-valor $=\\mathbf{0{,}0051}\\Rightarrow$ <b>rejeita-se nos dois níveis<\/b>. A taxa real supera os 8% declarados."}, {"a": 21, "tipo": "Exercício 3", "titulo": "Poder e tamanho de amostra", "q": "Um processo tem desvio padrão conhecido 8 e valor nominal 100. Com 25 medidas e $\\alpha=0{,}05$, calcule o poder contra a alternativa 104. Determine depois o $n$ que levaria o poder a $0{,}90$.", "r": "$EP=\\dfrac{8}{\\sqrt{25}}=1{,}6$; $\\;\\dfrac{\\delta}{EP}=\\dfrac{4}{1{,}6}=2{,}5$.<br>\n$\\beta=\\Phi(1{,}960-2{,}5)=\\Phi(-0{,}54)=0{,}2946$ (desprezando a cauda distante) $\\Rightarrow\\mathbf{\\text{poder}=0{,}7054}$<br>\nPara poder $0{,}90$ ($z_{0{,}90}=1{,}2816$): $n\\ge\\left(\\dfrac{(1{,}960+1{,}2816)\\times8}{4}\\right)^2=42{,}03\\Rightarrow\\mathbf{n=43}$, com poder $0{,}9064$."}, {"a": 22, "tipo": "Exemplo", "titulo": "O ajuste mudou a medida? (pareado)", "q": "Oito unidades foram medidas antes e depois de um ajuste. Antes: 42, 38, 45, 40, 41, 44, 39, 43. Depois: 40, 39, 42, 35, 40, 42, 36, 38. Teste a 5%.", "r": "Mesmas unidades $\\Rightarrow$ <b>pareado<\/b>. Diferenças (antes − depois): 2, −1, 3, 5, 1, 2, 3, 5.<br>\n$\\bar d=\\dfrac{20}{8}=2{,}5$; $\\;s_d=2{,}0$; $\\;\\widehat{EP}=\\dfrac{2{,}0}{\\sqrt8}=0{,}7071$<br>\n$t_{obs}=\\dfrac{2{,}5}{0{,}7071}=3{,}5355>t_{7;\\,0{,}975}=2{,}365\\Rightarrow$ <b>rejeita-se $H_0$<\/b>: o ajuste reduziu a medida.<br>\nComo dois grupos independentes, as nuvens se sobrepõem; como diferenças, se afastam do zero."}, {"a": 22, "tipo": "Exemplo", "titulo": "Dois fornecedores (Welch)", "q": "Doze unidades do primeiro fornecedor deram média $48{,}5$ com $s=4{,}2$. Quinze do segundo deram média $42{,}0$ com $s=7{,}8$. Teste a 5%.", "r": "$\\dfrac{s_1^2}{n_1}=\\dfrac{17{,}64}{12}=1{,}47$; $\\;\\dfrac{s_2^2}{n_2}=\\dfrac{60{,}84}{15}=4{,}056$; $\\;EP=\\sqrt{5{,}526}=2{,}3507$<br>\n$t_{obs}=\\dfrac{6{,}5}{2{,}3507}=2{,}7651$<br>\n$\\nu=\\dfrac{(1{,}47+4{,}056)^2}{\\frac{1{,}47^2}{11}+\\frac{4{,}056^2}{14}}=\\dfrac{30{,}537}{0{,}19645+1{,}17508}=22{,}26\\Rightarrow\\nu=22$ (para baixo), crítico $2{,}074$.<br>\n$2{,}7651>2{,}074\\Rightarrow$ <b>rejeita-se $H_0$<\/b>: os fornecedores diferem."}, {"a": 22, "tipo": "Exemplo", "titulo": "Duas linhas de produção", "q": "Numa linha, 48 das 400 unidades inspecionadas foram reprovadas. Na outra, 21 das 300. Teste a 5% se as taxas diferem.", "r": "Validade: 48, 352, 21 e 279 são todos grandes. $\\hat p_1=0{,}12$; $\\;\\hat p_2=0{,}07$; $\\;\\hat p_c=\\dfrac{69}{700}=0{,}098571$.<br>\n$EP_0=\\sqrt{0{,}098571\\times0{,}901429\\times\\left(\\dfrac1{400}+\\dfrac1{300}\\right)}=0{,}022767$<br>\n$z_{obs}=\\dfrac{0{,}05}{0{,}022767}=2{,}1962$. p-valor $\\approx\\mathbf{0{,}0278}$: rejeita a 5%, não a 1%.<br>\nO teste usa a proporção combinada; o intervalo usa as duas separadas. Perto da fronteira podem discordar."}, {"a": 22, "tipo": "Exercício 1", "titulo": "Teste pareado com seis diferenças", "q": "Seis unidades foram medidas em duas condições. As diferenças (primeira − segunda) valeram −1, 1, 2, 2, 3 e 5. Teste a 5% se as condições diferem e construa o IC de 95%.", "r": "$\\bar d=\\dfrac{12}{6}=2{,}0$; $\\;s_d=2{,}0$; $\\;\\widehat{EP}=\\dfrac{2{,}0}{\\sqrt6}=0{,}8165$<br>\n$t_{obs}=\\dfrac{2{,}0}{0{,}8165}=2{,}4495<t_{5;\\,0{,}975}=2{,}571\\Rightarrow$ <b>não se rejeita $H_0$<\/b>.<br>\nIC: $2{,}0\\pm2{,}571\\times0{,}8165=2{,}0\\pm2{,}0992=\\mathbf{[-0{,}099;\\;4{,}099]}$, que contém o zero por pouco."}, {"a": 22, "tipo": "Exercício 2", "titulo": "Welch com dois processos", "q": "Dez unidades de um processo deram média $28{,}4$ com $s=3{,}0$. Doze de outro deram média $23{,}9$ com $s=5{,}0$. Teste a 5% se as médias diferem e construa o IC de 95%.", "r": "$\\dfrac{s_1^2}{n_1}=0{,}9$; $\\;\\dfrac{s_2^2}{n_2}=2{,}0833$; $\\;EP=\\sqrt{2{,}9833}=1{,}7272$<br>\n$t_{obs}=\\dfrac{4{,}5}{1{,}7272}=2{,}6053$<br>\n$\\nu=\\dfrac{(0{,}9+2{,}0833)^2}{\\frac{0{,}9^2}{9}+\\frac{2{,}0833^2}{11}}=\\dfrac{8{,}9001}{0{,}09+0{,}39456}=18{,}37\\Rightarrow\\nu=18$, crítico $2{,}101$.<br>\n$2{,}6053>2{,}101\\Rightarrow$ <b>rejeita-se $H_0$<\/b>. IC: $4{,}5\\pm2{,}101\\times1{,}7272=\\mathbf{[0{,}871;\\;8{,}129]}$"}, {"a": 22, "tipo": "Exercício 3", "titulo": "Duas proporções: teste e IC", "q": "Duzentas e cinquenta unidades de cada uma de duas linhas foram inspecionadas. Reprovaram 35 na primeira e 20 na segunda. (a) Teste a 5% se as taxas diferem. (b) Construa o IC de 95% para a diferença.", "r": "Validade: 35, 215, 20 e 230. $\\hat p_1=0{,}14$; $\\;\\hat p_2=0{,}08$; $\\;\\hat p_c=\\dfrac{55}{500}=0{,}11$.<br>\n(a) $EP_0=\\sqrt{0{,}11\\times0{,}89\\times0{,}008}=0{,}027986$; $\\;z_{obs}=\\dfrac{0{,}06}{0{,}027986}=2{,}144$. p-valor $=\\mathbf{0{,}0324}$: rejeita a 5%, não a 1%.<br>\n(b) $EP=\\sqrt{\\dfrac{0{,}14\\times0{,}86}{250}+\\dfrac{0{,}08\\times0{,}92}{250}}=0{,}027857$. IC: $0{,}06\\pm1{,}960\\times0{,}027857=\\mathbf{[0{,}0054;\\;0{,}1146]}$"}, {"a": 23, "tipo": "Exemplo", "titulo": "O saldo depois de 100 ciclos", "q": "Um contador parte de zero e, a cada ciclo, sobe 1 com probabilidade $0{,}55$ ou desce 1 com probabilidade $0{,}45$, independentemente. Depois de 100 ciclos, calcule a média e o desvio padrão da posição e a probabilidade de ela não estar acima de zero.", "r": "$E(S_{100})=100(2\\times0{,}55-1)=\\mathbf{10}$; $\\;\\operatorname{Var}=4\\times100\\times0{,}55\\times0{,}45=99$; $\\;\\mathbf{DP\\approx9{,}95}$<br>\n$S_{100}=2B-100$, com $B\\sim\\text{Bin}(100;\\;0{,}55)$: $\\;S\\le0\\iff B\\le50$.<br>\nNormal com correção: $\\Phi\\!\\left(\\dfrac{50{,}5-55}{\\sqrt{24{,}75}}\\right)=\\Phi(-0{,}90)=\\mathbf{0{,}1841}$ (exato $0{,}1827$)."}, {"a": 23, "tipo": "Exemplo", "titulo": "Duas fontes de ocorrências", "q": "Duas fontes independentes geram ocorrências segundo processos de Poisson, com taxas 2 e 3 por hora. (a) Probabilidade de no máximo 2 ocorrências em meia hora? (b) De esperar mais de 20 minutos pela próxima? (c) Entre as próximas 5 ocorrências, de exatamente 2 virem da primeira fonte?", "r": "O total é Poisson de taxa $\\lambda=5$ por hora.<br>\n(a) $N(\\tfrac12)\\sim\\text{Poisson}(2{,}5)$: $\\;e^{-2{,}5}\\left(1+2{,}5+\\dfrac{2{,}5^2}{2}\\right)\\approx\\mathbf{0{,}5438}$<br>\n(b) $T_1\\sim\\text{Exp}(5)$: $\\;P\\left(T_1>\\tfrac13\\right)=e^{-5/3}\\approx\\mathbf{0{,}1889}$<br>\n(c) Cada ocorrência vem da fonte 1 com prob. $\\dfrac25=0{,}4$: $\\;\\dbinom52\\,0{,}4^2\\,0{,}6^3=\\mathbf{0{,}3456}$"}, {"a": 23, "tipo": "Exemplo", "titulo": "O estado de um equipamento (Markov)", "q": "Inspeção semanal: operando (O), degradado (D) ou em reparo (R). Matriz de transição (linhas e colunas na ordem O, D, R):<br>$P=\\begin{pmatrix}0{,}90&0{,}10&0\\\\0&0{,}70&0{,}30\\\\0{,}60&0&0{,}40\\end{pmatrix}$<br>Partindo de O, calcule $\\pi^{(1)}$ e $\\pi^{(2)}$. Partindo de D, qual a chance de R daqui a duas semanas?", "r": "$\\pi^{(0)}=(1;0;0)\\Rightarrow\\pi^{(1)}=$ linha O $=\\mathbf{(0{,}90;\\;0{,}10;\\;0)}$<br>\n$\\pi^{(2)}=\\pi^{(1)}P=(0{,}90\\times0{,}90;\\;0{,}90\\times0{,}10+0{,}10\\times0{,}70;\\;0{,}10\\times0{,}30)=\\mathbf{(0{,}81;\\;0{,}16;\\;0{,}03)}$<br>\nDe D, caminhos até R em 2 passos: D→D→R e D→R→R ($p_{DO}=0$): $\\;0{,}70\\times0{,}30+0{,}30\\times0{,}40=\\mathbf{0{,}33}$"}, {"a": 23, "tipo": "Exercício 1", "titulo": "Passeio simétrico de 10 passos", "q": "Um passeio simétrico parte de zero e dá 10 passos. (a) Média e desvio padrão de $S_{10}$. (b) $P(S_{10}=0)$ e $P(S_{10}\\ge6)$. (c) Quanto vale $P(S_{10}=3)$?", "r": "(a) $p=\\frac12$: $E(S_{10})=0$, $\\;\\operatorname{Var}=10$, $\\;\\mathbf{DP\\approx3{,}162}$<br>\n(b) $S_{10}=2B_{10}-10$, $\\;B_{10}\\sim\\text{Bin}(10;\\;0{,}5)$.<br>\n$P(S_{10}=0)=P(B=5)=\\dfrac{252}{1024}\\approx\\mathbf{0{,}2461}$<br>\n$P(S_{10}\\ge6)=P(B\\ge8)=\\dfrac{45+10+1}{1024}\\approx\\mathbf{0{,}0547}$<br>\n(c) <b>Zero:<\/b> $\\dfrac{10+3}{2}=6{,}5$ não é inteiro. Após 10 passos a posição é par."}, {"a": 23, "tipo": "Exercício 2", "titulo": "Ocorrências críticas (afinamento)", "q": "Ocorrências chegam segundo um processo de Poisson de taxa 6 por hora. Cada uma é crítica com probabilidade $0{,}25$, independentemente. (a) Probabilidade de nenhuma crítica em 2 horas? (b) Tempo médio até a primeira crítica? E a probabilidade de passar 1 hora sem nenhuma? (c) Probabilidade de a segunda crítica chegar depois de 1 hora?", "r": "As críticas formam um Poisson de taxa $0{,}25\\times6=1{,}5$ por hora.<br>\n(a) $N(2)\\sim\\text{Poisson}(3)$: $\\;P(N=0)=e^{-3}\\approx\\mathbf{0{,}0498}$<br>\n(b) Espera $\\sim\\text{Exp}(1{,}5)$: média $\\dfrac1{1{,}5}$ h $=\\mathbf{40}$ min. $\\;P(1\\text{ h sem nenhuma})=e^{-1{,}5}\\approx\\mathbf{0{,}2231}$<br>\n(c) $\\{W_2>1\\}=\\{N(1)\\le1\\}$, com $N(1)\\sim\\text{Poisson}(1{,}5)$: $\\;e^{-1{,}5}(1+1{,}5)\\approx\\mathbf{0{,}5578}$"}, {"a": 23, "tipo": "Exercício 3", "titulo": "Cadeia bom/ruim", "q": "Um sistema é classificado a cada hora como bom (B) ou ruim (R). Hoje está em B e a matriz de transição (ordem B, R) é $P=\\begin{pmatrix}0{,}8&0{,}2\\\\0{,}3&0{,}7\\end{pmatrix}$. (a) O que o modelo de Markov supõe? (b) Calcule $\\pi^{(2)}$. (c) Ache a estacionária e interprete $\\pi_R$.", "r": "(a) A chance de mudar na próxima hora depende só da condição atual; há quanto tempo está nela não importa.<br>\n(b) $\\pi^{(1)}=(0{,}8;\\;0{,}2)$; $\\;\\pi^{(2)}=(0{,}8\\times0{,}8+0{,}2\\times0{,}3;\\;0{,}8\\times0{,}2+0{,}2\\times0{,}7)=\\mathbf{(0{,}70;\\;0{,}30)}$<br>\n(c) $\\pi=\\pi P$: $\\;\\pi_B=0{,}8\\,\\pi_B+0{,}3\\,\\pi_R\\Rightarrow0{,}2\\,\\pi_B=0{,}3\\,\\pi_R$; com $\\pi_B+\\pi_R=1$: $\\;\\mathbf{\\pi=(0{,}6;\\;0{,}4)}$<br>\nNo longo prazo, 40% das horas em R, qualquer que seja o estado de hoje."}];

</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem("me323:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("me323:"+k,JSON.stringify(v))}catch(e){}}};
const IDS=Object.keys(LESSONS).map(Number);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- estado
let S=store.get("st",null);
if(!S){
  S={xp:0,box:{},seen:{},best:0,ach:{},ans:0,ok:0,fast:0,sessions:0,aw:{},exam:""};
  const oldK=store.get("known",{}); for(const i in oldK){S.box["c"+i]=oldK[i]?2:0;S.seen["c"+i]=1}
  const oldD=store.get("done",{}); for(const i in oldD){if(oldD[i]){S.box["s"+i]=2;S.seen["s"+i]=1;S.aw["s"+i]=1}}
}
const save=()=>store.set("st",S);
let sel=store.get("sel","all"), view=store.get("view","painel"), sound=store.get("snd",true);
const inSel=a=>sel==="all"||sel===a;

// itens
const ITEMS=[].concat(
  CARDS.map((c,i)=>({k:"c"+i,a:c[0],t:"card",i})),
  QUIZ.map((q,i)=>({k:"q"+i,a:q[0],t:"quiz",i})),
  SLIDES.map((s,i)=>({k:"s"+i,a:s.a,t:"slide",i})));
const box=k=>S.box[k]||0;
function mastery(a){const it=ITEMS.filter(x=>a==null||x.a===a);return it.reduce((s,x)=>s+box(x.k),0)/(2*it.length)}
const LV=[["Não iniciado","lv0"],["Fraco","lv1"],["Razoável","lv2"],["Bom","lv3"],["Dominado","lv4"]];
function lvOf(m,a){if(a!=null&&!ITEMS.some(x=>x.a===a&&S.seen[x.k]))return 0;return m>=.85?4:m>=.6?3:m>=.35?2:1}
const barColor=l=>["var(--chip)","var(--bad)","var(--gold)","var(--accent)","var(--ok)"][l];

// nível
const TITLES=["Calouro","Bixo esforçado","Frequentador da monitoria","Domador de Φ","Estatístico júnior","Caçador de p-valor","Mestre do TCL","Doutor em Markov","Lenda do IMECC"];
const lvlStart=L=>30*L*(L-1);
function level(){let L=1;while(S.xp>=lvlStart(L+1))L++;return L}

// som
let actx=null;
function beep(type){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;
 const f=type==="ok"?[660,880]:type==="lvl"?[523,659,784,1046]:[220,160];
 f.forEach((fr,i)=>o.frequency.setValueAtTime(fr,t+i*.09));g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+f.length*.09+.12);o.start(t);o.stop(t+f.length*.09+.13)}catch(e){}}
$("#snd").onclick=()=>{sound=!sound;store.set("snd",sound);$("#snd").textContent=sound?"🔊":"🔇"};
$("#snd").textContent=sound?"🔊":"🔇";

// tema
let theme=store.get("theme",null); if(theme) document.documentElement.dataset.theme=theme;
$("#theme").onclick=()=>{const dark=matchMedia("(prefers-color-scheme: dark)").matches;const cur=document.documentElement.dataset.theme||(dark?"dark":"light");theme=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;store.set("theme",theme)};

// toasts e confete
function toast(t,s){const d=document.createElement("div");d.className="toast";d.innerHTML=`<b>${t}</b>${s||""}`;$("#toasts").appendChild(d);setTimeout(()=>d.remove(),3800)}
function burst(n){const em=["🎉","⭐","✨","🏆","🔥"];for(let i=0;i<(n||18);i++){const e=document.createElement("div");e.className="burst";e.textContent=em[i%em.length];e.style.left=(innerWidth/2)+"px";e.style.top=(innerHeight/2)+"px";e.style.setProperty("--dx",(Math.random()*600-300)+"px");e.style.setProperty("--dy",(Math.random()*-420-60)+"px");e.style.setProperty("--r",(Math.random()*540-270)+"deg");document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}

// conquistas
const ACH=[
 ["primeiro","👣","Primeiro passo","Responda o primeiro item",()=>S.ans>=1],
 ["combo5","🔥","Em chamas","Combo de 5 acertos",()=>S.best>=5],
 ["combo10","☄️","Imparável","Combo de 10 acertos",()=>S.best>=10],
 ["xp100","🥉","100 XP","Some 100 XP",()=>S.xp>=100],
 ["xp500","🥈","500 XP","Some 500 XP",()=>S.xp>=500],
 ["xp1000","🥇","1000 XP","Some 1000 XP",()=>S.xp>=1000],
 ["veloz","⚡","Velocista","10 respostas rápidas",()=>S.fast>=10],
 ["sessao","🏁","Primeira rodada","Complete uma rodada",()=>S.sessions>=1],
 ["perfeito","💯","Gabaritou","Rodada sem nenhum erro",()=>S.perfect],
 ["dom1","🎓","Dominou uma aula","Uma aula em “Dominado”",()=>IDS.some(a=>lvOf(mastery(a),a)===4)],
 ["metade","🧭","Meio caminho","Todas as aulas ≥ 35%",()=>IDS.every(a=>mastery(a)>=.35)],
 ["tudo","👑","Pronto pra prova","Todas as aulas ≥ 60%",()=>IDS.every(a=>mastery(a)>=.6)],
 ["slides10","📝","Mão na massa","10 questões dos slides feitas",()=>ITEMS.filter(x=>x.t==="slide"&&box(x.k)===2).length>=10],
 ["slidesall","📚","Zerou os slides","Todas as questões dos slides",()=>ITEMS.filter(x=>x.t==="slide").every(x=>box(x.k)===2)]
];
function checkAch(){ACH.forEach(([id,e,t,d,f])=>{if(!S.ach[id]&&f()){S.ach[id]=1;toast(e+" Conquista: "+t,d);burst(14);beep("lvl")}});save()}

function addXP(n){const L0=level();S.xp+=n;const L1=level();if(L1>L0){toast("⬆️ Subiu para o nível "+L1,TITLES[Math.min(L1-1,TITLES.length-1)]);burst(24);beep("lvl")}renderHUD()}

// HUD
function renderHUD(){const L=level(),a=lvlStart(L),b=lvlStart(L+1);
 $("#hud-lvl").textContent="Nv "+L;$("#hud-bar").style.width=(100*(S.xp-a)/(b-a))+"%";$("#hud-xp").textContent=S.xp+" XP";
 $("#hud-dom").textContent=Math.round(100*mastery())+"%";renderExam()}
function renderExam(){const el=$("#hud-exam span"),inp=$("#examIn");if(document.activeElement!==inp)inp.value=S.exam||"";inp.style.display=S.exam?"none":"";if(!S.exam){el.textContent="prova às";return}
 const [h,m]=S.exam.split(":").map(Number);const now=new Date(),t=new Date();t.setHours(h,m,0,0);let d=t-now;
 if(d<=0){el.textContent="é agora! boa prova 🍀";return}const hh=Math.floor(d/36e5),mm=Math.floor(d%36e5/6e4);el.textContent=`prova em ${hh}h${String(mm).padStart(2,"0")}`}
$("#examIn").onchange=e=>{const v=e.target.value;if(/^\d{1,2}:\d{2}$/.test(v)){S.exam=v;save();renderExam()}};
$("#hud-exam span").onclick=e=>{if(S.exam){e.preventDefault();S.exam="";save();renderExam();$("#examIn").focus()}};
setInterval(renderExam,30000);

// filtros
function renderFilters(){const f=$("#filters");f.innerHTML="";f.style.display=view==="painel"?"none":"flex";
 const mk=(v,t)=>{const b=document.createElement("button");b.className="chip"+(sel===v?" on":"");b.textContent=t;b.title=v==="all"?"Todas as aulas":LESSONS[v];b.onclick=()=>{sel=v;store.set("sel",sel);renderFilters();renderView()};f.appendChild(b)};
 mk("all","Todas");IDS.forEach(a=>mk(a,"A"+a))}
function setView(v){view=v;store.set("view",v);document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));renderFilters();renderView();scrollTo(0,0)}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
function renderView(){({painel:renderPainel,treino:renderTreino,resumo:renderResumo,slides:renderSlides})[view]()}

// ---------- PAINEL
function renderPainel(){
 const m=mastery(),L=level();
 const weak=IDS.slice().sort((x,y)=>mastery(x)-mastery(y)).slice(0,3);
 const acc=S.ans?Math.round(100*S.ok/S.ans):0;
 let h=`<div class="hero">
  <div class="card"><div class="row" style="align-items:center;gap:16px;flex-wrap:nowrap">
   <div class="ring" style="--p:${Math.round(m*100)}"><div>${Math.round(m*100)}%<small>domínio</small></div></div>
   <div><div class="muted small">Nível ${L}</div><h3 style="font-size:21px">${TITLES[Math.min(L-1,TITLES.length-1)]}</h3>
   <div class="muted small">${S.xp} XP · faltam ${lvlStart(L+1)-S.xp} para o nível ${L+1}</div></div></div>
   <div class="stats"><div class="stat"><b>${S.ans}</b><span>respondidas</span></div><div class="stat"><b>${acc}%</b><span>acerto</span></div><div class="stat"><b>🔥 ${S.best}</b><span>melhor combo</span></div></div>
  </div>
  <div class="card"><h3>Estudo rápido</h3><p class="muted small" style="margin:0 0 10px">A prova é hoje: rodadas curtas, focadas no que você ainda não domina.</p>
   <div class="row" style="flex-direction:column">
    <button class="btn pri big" id="go-fast">⚡ Rodada relâmpago (10)</button>
    <button class="btn big" id="go-weak">🎯 Atacar pontos fracos: ${weak.map(a=>"A"+a).join(", ")}</button>
    <button class="btn" id="go-err" ${ITEMS.some(x=>x.t!=="slide"&&S.seen[x.k]&&box(x.k)===0)?"":"disabled"}>🔁 Revisar meus erros</button>
   </div></div>
 </div>
 <h3 style="margin:18px 0 6px">Domínio por aula</h3>
 <div class="lessons">`;
 IDS.forEach(a=>{const ma=mastery(a),l=lvOf(ma,a);const its=ITEMS.filter(x=>x.a===a);const seen=its.filter(x=>S.seen[x.k]).length;
  h+=`<div class="les"><div class="h"><span class="tag">A${a}</span><b>${LESSONS[a]}</b></div>
   <div class="row small muted" style="margin-top:6px;align-items:center"><span>${Math.round(ma*100)}% · ${seen}/${its.length} vistos</span><span class="badge ${LV[l][1]}" style="margin-left:auto">${LV[l][0]}</span></div>
   <div class="bar"><div style="width:${Math.max(2,ma*100)}%;background:${barColor(l)}"></div></div>
   <div class="acts"><button class="btn" data-train="${a}">⚡ Treinar</button><button class="btn" data-res="${a}">📘 Cola</button></div></div>`});
 h+=`</div><h3 style="margin:20px 0 6px">Conquistas <span class="muted small">${Object.keys(S.ach).length}/${ACH.length}</span></h3><div class="ach">`;
 ACH.forEach(([id,e,t,d])=>{h+=`<div class="a ${S.ach[id]?"got":""}"><span class="e">${e}</span><b>${t}</b><br>${d}</div>`});
 h+=`</div><div class="card small muted">Como o domínio é medido: cada flashcard e pergunta tem 3 níveis: 0 (não sabe), 1 (acertou uma vez) e 2 (dominado, dois acertos seguidos). Errou, volta a 0. Questão dos slides marcada como feita conta como dominada. O domínio da aula é a média desses níveis. <button class="btn" id="reset" style="margin-left:6px;padding:4px 10px;font-size:12.5px">Zerar tudo</button></div>`;
 $("#v-painel").innerHTML=h;
 $("#go-fast").onclick=()=>startSession({mode:"mix",n:10,lessons:IDS});
 $("#go-weak").onclick=()=>startSession({mode:"mix",n:10,lessons:weak});
 $("#go-err").onclick=()=>startSession({mode:"err",n:15,lessons:IDS});
 document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>startSession({mode:"mix",n:10,lessons:[+b.dataset.train]}));
 document.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{sel=+b.dataset.res;store.set("sel",sel);setView("resumo")});
 $("#reset").onclick=e=>{const b=e.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Clique de novo para zerar";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Zerar tudo"}},4000);return}{S={xp:0,box:{},seen:{},best:0,ach:{},ans:0,ok:0,fast:0,sessions:0,aw:{},exam:S.exam};save();renderHUD();renderPainel()}};
}

// ---------- TREINO
let sess=null, tmr=null, cfg=store.get("cfg",{mode:"mix",n:10});
function pick(opts){
 let pool=ITEMS.filter(x=>x.t!=="slide"&&(opts.lessons?opts.lessons.includes(x.a):inSel(x.a)));
 if(opts.mode==="quiz") pool=pool.filter(x=>x.t==="quiz");
 if(opts.mode==="card") pool=pool.filter(x=>x.t==="card");
 if(opts.mode==="err") pool=pool.filter(x=>S.seen[x.k]&&box(x.k)===0);
 const w=x=>{const b=box(x.k);return (S.seen[x.k]?[9,3,.6][b]:6)*(1.6-mastery(x.a))};
 const out=[];const p=pool.map(x=>({x,w:w(x)*(.6+Math.random()*.8)}));p.sort((a,b)=>b.w-a.w);
 const n=opts.n==="all"?p.length:Math.min(opts.n,p.length);
 for(let i=0;i<n;i++) out.push(p[i].x);
 return shuffle(out);
}
function startSession(opts){
 const list=pick(opts);
 if(!list.length){toast("Nada para treinar aqui","Escolha outro filtro ou modo.");return}
 sess={list:list.map(x=>({...x,order:x.t==="quiz"?shuffle([0,1,2,3]):null})),i:0,combo:0,best:0,xp:0,ok:0,wrong:[],state:"ask",t0:Date.now(),opts,before:{}};
 IDS.forEach(a=>sess.before[a]=mastery(a));
 if(view!=="treino") setView("treino"); else renderTreino();
}
function grade(it,ok){
 const k=it.k;S.seen[k]=1;S.ans++;
 const dt=(Date.now()-sess.t0)/1000;
 let g=0;
 if(ok){S.ok++;sess.ok++;sess.combo++;sess.best=Math.max(sess.best,sess.combo);S.best=Math.max(S.best,sess.combo);
  S.box[k]=Math.min(2,box(k)+1);
  g=(it.t==="quiz"?10:6)+Math.min(10,2*(sess.combo-1));
  if(it.t==="quiz"&&dt<12){g+=5;S.fast++;sess.fastNow=true}else sess.fastNow=false;
  beep("ok")}
 else{S.box[k]=0;sess.combo=0;sess.wrong.push(it);sess.fastNow=false;beep("bad")}
 sess.xp+=g;sess.last=g;addXP(g);save();checkAch();
}
function renderTreino(){
 const el=$("#v-treino");clearInterval(tmr);
 if(!sess){
  const segs=(name,vals,lab)=>`<div class="seg">${vals.map((v,i)=>`<button data-${name}="${v}" class="${cfg[name]==v?"on":""}">${lab[i]}</button>`).join("")}</div>`;
  el.innerHTML=`<div class="card"><h3>Montar rodada</h3><p class="muted small" style="margin:0 0 10px">Usa o filtro de aulas acima (${sel==="all"?"todas":"A"+sel}). O sorteio prioriza o que você erra ou ainda não viu.</p>
   <div class="row" style="align-items:center;gap:12px"><span class="small muted">Tipo</span>${segs("mode",["mix","quiz","card"],["Misto","Só quiz","Só flashcards"])}<span class="small muted">Tamanho</span>${segs("n",[10,20,"all"],["10","20","Todas"])}</div>
   <div class="row" style="margin-top:14px"><button class="btn pri big" id="go">▶ Começar</button></div></div>
   <div class="modes">
    <button class="mode" id="m-fast"><span class="e">⚡</span><b>Relâmpago</b><span>10 itens mistos de todas as aulas</span></button>
    <button class="mode" id="m-weak"><span class="e">🎯</span><b>Pontos fracos</b><span>As 3 aulas com menor domínio</span></button>
    <button class="mode" id="m-err"><span class="e">🔁</span><b>Revisar erros</b><span>Só o que você errou por último</span></button>
    <button class="mode" id="m-maratona"><span class="e">🏃</span><b>Maratona</b><span>Todas as perguntas do quiz, embaralhadas</span></button>
   </div>`;
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;store.set("cfg",cfg);renderTreino()});
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{cfg.n=b.dataset.n==="all"?"all":+b.dataset.n;store.set("cfg",cfg);renderTreino()});
  $("#go").onclick=()=>startSession({mode:cfg.mode,n:cfg.n,lessons:null});
  $("#m-fast").onclick=()=>startSession({mode:"mix",n:10,lessons:IDS});
  $("#m-weak").onclick=()=>startSession({mode:"mix",n:10,lessons:IDS.slice().sort((x,y)=>mastery(x)-mastery(y)).slice(0,3)});
  $("#m-err").onclick=()=>startSession({mode:"err",n:15,lessons:IDS});
  $("#m-maratona").onclick=()=>startSession({mode:"quiz",n:"all",lessons:IDS});
  return;
 }
 if(sess.i>=sess.list.length) return renderEnd();
 const it=sess.list[sess.i],n=sess.list.length;
 let h=`<div class="shead"><span class="muted small">${sess.i+1} de ${n}</span><span class="combo">${sess.combo>=2?"🔥 combo x"+sess.combo:""}</span><span style="margin-left:auto" class="small"><b class="gain" style="color:var(--gold)">+${sess.xp} XP</b></span><button class="btn" id="quit" style="padding:5px 10px;font-size:13px">Sair</button></div>
 <div class="progress"><div style="width:${100*sess.i/n}%"></div></div><div class="card" id="qcard">`;
 if(it.t==="quiz"){
  const [a,perg,opts,corr,expl]=QUIZ[it.i];
  h+=`<span class="tag">A${a}</span><span class="muted small">${LESSONS[a]} · quiz</span><h3 style="margin-top:8px">${perg}</h3>`;
  if(sess.state==="ask") h+=`<div class="timer"><div id="tbar"></div></div><div class="kbd" style="margin-top:3px">Responda em até 12 s para ganhar o bônus ⚡</div>`;
  it.order.forEach((oi,k)=>{let c="opt";if(sess.state!=="ask"){if(oi===corr)c+=" right";else if(oi===sess.picked)c+=" wrong"}
   h+=`<button class="${c}" data-o="${oi}" ${sess.state!=="ask"?"disabled":""}><b>${k+1})</b> ${opts[oi]}</button>`});
  if(sess.state!=="ask"){const ok=sess.picked===corr;
   h+=`<div class="expl"><b>${ok?"✔ Correto!":"✘ Errou."}</b> ${ok?`<span class="gain">+${sess.last} XP${sess.fastNow?" ⚡":""}</span> `:""}${expl}</div>
   <div class="row center" style="margin-top:12px"><button class="btn pri" id="next">${sess.i+1<n?"Próxima →":"Ver resultado"}</button></div>`}
  h+=`<p class="kbd center" style="text-align:center">Teclas: 1–4 respondem · Enter avança</p>`;
 }else{
  const [a,fr,vs]=CARDS[it.i];
  h+=`<span class="tag">A${a}</span><span class="muted small">${LESSONS[a]} · flashcard</span><div class="fcq">${fr}</div>`;
  if(sess.state==="ask") h+=`<div class="row center"><button class="btn pri" id="show">Mostrar resposta</button></div><p class="kbd" style="text-align:center">Pense na resposta antes · espaço mostra</p>`;
  else if(sess.state==="shown") h+=`<div class="fca">${vs}</div><div class="row center" style="margin-top:12px"><button class="btn bad" id="no">✘ Não sabia</button><button class="btn ok" id="yes">✔ Sabia</button></div><p class="kbd" style="text-align:center">Teclas: 1 não sabia · 2 sabia</p>`;
  else h+=`<div class="fca">${vs}</div><div class="row center" style="margin-top:12px">${sess.last?`<span class="gain">+${sess.last} XP</span>`:""}<button class="btn pri" id="next">${sess.i+1<n?"Próxima →":"Ver resultado"}</button></div>`;
 }
 h+=`</div>`;
 el.innerHTML=h;
 $("#quit").onclick=()=>{{sess.list=sess.list.slice(0,sess.i+(sess.state==="done"?1:0));sess.i=sess.list.length;renderTreino()}};
 if(it.t==="quiz"&&sess.state==="ask"){
  const bar=$("#tbar");const T=12000;tmr=setInterval(()=>{const p=Math.max(0,1-(Date.now()-sess.t0)/T);if(bar)bar.style.width=(p*100)+"%";if(p<=0)clearInterval(tmr)},100);
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
 }
 if($("#show")) $("#show").onclick=()=>{sess.state="shown";renderTreino()};
 if($("#no")) $("#no").onclick=()=>fcGrade(false);
 if($("#yes")) $("#yes").onclick=()=>fcGrade(true);
 if($("#next")) $("#next").onclick=next;
}
function answer(o){const it=sess.list[sess.i];if(sess.state!=="ask")return;sess.picked=o;const ok=o===QUIZ[it.i][3];grade(it,ok);sess.state="done";renderTreino();if(!ok)$("#qcard").classList.add("shake")}
function fcGrade(ok){const it=sess.list[sess.i];grade(it,ok);sess.state="done";if(!ok)sess.last=0;renderTreino();if(!ok)$("#qcard").classList.add("shake")}
function next(){sess.i++;sess.state="ask";sess.t0=Date.now();renderTreino()}
function renderEnd(){
 const el=$("#v-treino"),n=sess.list.length;
 if(!n){sess=null;return renderTreino()}
 if(!sess.counted){sess.counted=1;S.sessions++;if(sess.ok===n&&n>=5){S.perfect=true;burst(30)}save();checkAch()}
 const pct=Math.round(100*sess.ok/n);
 let up="";IDS.forEach(a=>{const d=mastery(a)-sess.before[a];if(Math.abs(d)>.001)up+=`<div class="row small" style="align-items:center;margin:3px 0"><span class="tag">A${a}</span><span style="flex:1">${LESSONS[a]}</span><b style="color:${d>0?"var(--ok)":"var(--bad)"}">${d>0?"▲":"▼"} ${Math.round(Math.abs(d)*100)} pts</b><span class="muted">→ ${Math.round(mastery(a)*100)}%</span></div>`});
 el.innerHTML=`<div class="card center" style="text-align:center"><h3>${pct===100?"Gabaritou! 💯":pct>=70?"Mandou bem! 🔥":pct>=40?"Tá evoluindo 💪":"Bora revisar 📘"}</h3>
  <p class="score">${sess.ok}/${n}</p><p class="muted">+${sess.xp} XP · melhor combo ${sess.best}</p>
  <div class="row center" style="justify-content:center">${sess.wrong.length?`<button class="btn pri" id="again-wrong">🔁 Refazer os ${sess.wrong.length} que errei</button>`:""}<button class="btn ${sess.wrong.length?"":"pri"}" id="again">⚡ Nova rodada</button><button class="btn" id="home">🏠 Painel</button></div></div>
  ${up?`<div class="card"><h3>O que mudou no seu domínio</h3>${up}</div>`:""}
  ${sess.wrong.length?`<div class="card"><h3>Revise antes de seguir</h3>${sess.wrong.map(it=>it.t==="quiz"?`<p><span class="tag">A${it.a}</span>${QUIZ[it.i][1]}<br><b>✔ ${QUIZ[it.i][2][QUIZ[it.i][3]]}</b><br><span class="muted small">${QUIZ[it.i][4]}</span></p>`:`<p><span class="tag">A${it.a}</span>${CARDS[it.i][1]}<br><b>✔</b> ${CARDS[it.i][2]}</p>`).join("")}</div>`:""}`;
 const opts=sess.opts,wr=sess.wrong;
 if($("#again-wrong")) $("#again-wrong").onclick=()=>{sess={list:shuffle(wr).map(x=>({...x,order:x.t==="quiz"?shuffle([0,1,2,3]):null})),i:0,combo:0,best:0,xp:0,ok:0,wrong:[],state:"ask",t0:Date.now(),opts,before:{}};IDS.forEach(a=>sess.before[a]=mastery(a));renderTreino()};
 $("#again").onclick=()=>startSession(opts);
 $("#home").onclick=()=>{sess=null;setView("painel")};
}
document.addEventListener("keydown",e=>{
 if(view!=="treino"||!sess||sess.i>=sess.list.length||e.target.tagName==="INPUT")return;
 const it=sess.list[sess.i];
 if(it.t==="quiz"&&sess.state==="ask"&&/^[1-4]$/.test(e.key)){answer(it.order[+e.key-1])}
 else if(it.t==="card"&&sess.state==="ask"&&(e.key===" "||e.key==="Enter")){e.preventDefault();sess.state="shown";renderTreino()}
 else if(it.t==="card"&&sess.state==="shown"&&(e.key==="1"||e.key==="2")){fcGrade(e.key==="2")}
 else if(sess.state==="done"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();next()}
});

// ---------- RESUMO
function renderResumo(){
 let h=`<div class="card small muted">Dica: leia a <b>cola rápida</b> (amarela) de cada aula e abra o resumo completo só onde travar. Depois clique em ⚡ para fixar.</div>`;
 IDS.filter(inSel).forEach(a=>{const l=lvOf(mastery(a),a);
  h+=`<div class="card"><div class="row" style="align-items:center"><span class="tag">A${a}</span><h3 style="margin:0">${LESSONS[a]}</h3><span class="badge ${LV[l][1]}" style="margin-left:auto;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px">${LV[l][0]} · ${Math.round(mastery(a)*100)}%</span></div>
  <div class="cola"><b class="t">⚡ Cola rápida</b><ul>${COLA[a].map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <details class="les2"><summary><span class="muted small">Resumo completo</span></summary>${RESUMO[a]}</details>
  <div class="row" style="margin-top:10px"><button class="btn pri" data-train="${a}">⚡ Treinar A${a}</button></div></div>`});
 if(sel==="all") h+=`<div class="card"><h3>Mapa final: qual ferramenta usar</h3><div class="tablewrap">${MAPA}</div></div>`;
 $("#v-resumo").innerHTML=h;
 document.querySelectorAll("#v-resumo [data-train]").forEach(b=>b.onclick=()=>startSession({mode:"mix",n:10,lessons:[+b.dataset.train]}));
}

// ---------- SLIDES
function renderSlides(){
 const el=$("#v-slides");
 const items=ITEMS.filter(x=>x.t==="slide"&&inSel(x.a));
 const nd=items.filter(x=>box(x.k)===2).length;
 let h=`<div class="card"><b>${items.length} questões</b> <span class="muted">(exemplos e exercícios guiados dos slides)</span> · <span class="gain" style="color:var(--gold)">+15 XP</span> <span class="muted small">por questão feita</span>
  <div class="progress"><div style="width:${items.length?100*nd/items.length:0}%"></div></div><span class="muted small">${nd} feitas · tente resolver antes de abrir a resolução</span>
  <div class="row" style="margin-top:8px"><button class="btn" id="sl-open">Abrir todas as resoluções</button><button class="btn" id="sl-close">Fechar todas</button></div></div>`;
 let cur=null;
 items.forEach(({k,i,a})=>{const s=SLIDES[i],done=box(k)===2;
  if(a!==cur){cur=a;h+=`<h3 style="margin:22px 0 4px">A${a} · ${LESSONS[a]}</h3>`}
  h+=`<div class="card ${done?"done-card":""}"><div class="q-head"><span class="tag">${s.tipo}</span><h3>${s.titulo}</h3><label><input type="checkbox" data-k="${k}" ${done?"checked":""}> feito</label></div>
  <div style="margin-top:8px">${s.q}</div>
  <details class="solw" style="margin-top:10px"><summary class="btn" style="display:inline-block">Ver resolução</summary><div class="sol">${s.r}</div></details></div>`});
 el.innerHTML=h;
 el.querySelectorAll("input[data-k]").forEach(c=>c.onchange=()=>{const k=c.dataset.k;S.seen[k]=1;
  if(c.checked){S.box[k]=2;if(!S.aw[k]){S.aw[k]=1;addXP(15);toast("📝 +15 XP","Questão dos slides concluída");beep("ok")}}else S.box[k]=0;
  save();checkAch();renderHUD();const y=scrollY;renderSlides();scrollTo(0,y)});
 $("#sl-open").onclick=()=>el.querySelectorAll("details.solw").forEach(d=>d.open=true);
 $("#sl-close").onclick=()=>el.querySelectorAll("details.solw").forEach(d=>d.open=false);
}

renderHUD(); setView(view);
})();
// ---------- fórmulas (KaTeX)
(function(){
 const opts={delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false,strict:false};
 let busy=false,pend=false;
 function run(){if(!window.renderMathInElement)return;busy=true;try{renderMathInElement(document.querySelector("main"),opts)}catch(e){}busy=false}
 function sched(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;run()})}
 function start(){
  if(!window.renderMathInElement){document.getElementById("nomath").style.display="block";return}
  run();new MutationObserver(()=>{if(!busy)sched()}).observe(document.querySelector("main"),{childList:true,subtree:true});
 }
 if(document.readyState==="complete")start();else window.addEventListener("load",start);
})();
</script>
